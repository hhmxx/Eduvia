<!DOCTYPE html>
<html lang="lt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Eduvia</title>
<meta name="description" content="Eduvia – mokymosi svetainė mokiniams: fizikos temos „Slėgis“ ir „Mechaninis darbas, galia, energija“ bei istorijos tema „Lietuvos nepriklausomybės karas“ – teorija, pavyzdžiai, interaktyvus žemėlapis ir klausimai.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%234f46e5'/%3E%3Ctext x='32' y='45' font-size='34' text-anchor='middle' fill='white' font-family='sans-serif'%3EE%3C/text%3E%3C/svg%3E">
<style>
/* =====================================================================
   1. PAGRINDINIAI STILIAI IR SPALVOS
   ===================================================================== */
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
:root{
  --bg:#f4f5fa;--surface:#ffffff;--surface-2:#f7f8fc;
  --border:#e2e5f0;--border-strong:#c9cee0;
  --text:#1b2030;--text-soft:#3c445c;--muted:#68708a;
  --primary:#4f46e5;--primary-strong:#4338ca;--primary-soft:#eef0ff;--primary-text:#3730a3;
  --accent:#0e7490;--accent-soft:#e0f7fa;
  --ok:#15803d;--ok-soft:#e8f7ee;--bad:#b91c1c;--bad-soft:#fdeceb;--warn:#b45309;--warn-soft:#fdf3e2;
  --radius:16px;--radius-sm:10px;
  --shadow-sm:0 1px 2px rgba(18,24,44,.06),0 1px 3px rgba(18,24,44,.08);
  --shadow-md:0 4px 6px -2px rgba(18,24,44,.07),0 12px 28px -10px rgba(18,24,44,.18);
  --font:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,"Noto Sans",sans-serif;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#0d0f16;--surface:#161a24;--surface-2:#1b202c;
    --border:#282f3f;--border-strong:#39415a;
    --text:#e8ebf4;--text-soft:#c6cbdb;--muted:#98a0b8;
    --primary:#6366f1;--primary-strong:#4f46e5;--primary-soft:#232a4d;--primary-text:#c7ccff;
    --accent:#67e8f9;--accent-soft:#0e2b33;
    --ok:#4ade80;--ok-soft:#122a1d;--bad:#f87171;--bad-soft:#33171a;--warn:#fbbf24;--warn-soft:#2d2410;
    --shadow-sm:0 1px 2px rgba(0,0,0,.5);--shadow-md:0 12px 30px -12px rgba(0,0,0,.7);
  }
}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font);font-size:16px;line-height:1.65;min-height:100vh;overflow-x:clip}
.section-content p,.section-content li,.mini-card p,.callout p{overflow-wrap:break-word}
.math{max-width:100%}
img,svg{max-width:100%;height:auto}
a{color:var(--primary);text-decoration:none}
a:hover{text-decoration:underline}
:focus-visible{outline:3px solid var(--primary);outline-offset:2px;border-radius:6px}
.muted{color:var(--muted)}
.wrap{max-width:1180px;margin:0 auto;padding:0 20px}

/* =====================================================================
   2. MATEMATINĖS IŠRAIŠKOS (vidinė sintaksė [[ ... ]])
   ===================================================================== */
.math{white-space:normal;font-variant-numeric:lining-nums;letter-spacing:.01em}
.math .msep{margin:0 .22em;color:var(--muted)}
.frac{display:inline-flex;flex-direction:column;align-items:center;justify-content:center;vertical-align:middle;margin:0 .3em;line-height:1.12;font-size:.98em}
.frac>.num{padding:0 .45em .06em;border-bottom:1.6px solid currentColor}
.frac>.den{padding:.06em .45em 0}
.math sub{font-size:.72em;line-height:0}
.math sup{font-size:.72em;line-height:0}

/* =====================================================================
   3. PRADINIS (DALYKŲ) PUSLAPIS
   ===================================================================== */
.home-hero{background:linear-gradient(180deg,var(--primary-soft),transparent);border-bottom:1px solid var(--border);padding:40px 0 34px}
.brand{display:inline-flex;align-items:center;gap:8px;font-weight:800;letter-spacing:.01em;color:var(--primary-text);background:var(--surface);border:1px solid var(--border);border-radius:999px;padding:6px 14px;font-size:.92rem;box-shadow:var(--shadow-sm)}
.home-hero h1{font-size:clamp(1.7rem,4.5vw,2.5rem);margin:16px 0 6px;letter-spacing:-.02em}
.hero-sub{margin:0;color:var(--text-soft);max-width:640px}
.home-main{padding-top:26px;padding-bottom:10px}
.subject-grid{display:grid;gap:16px;grid-template-columns:repeat(auto-fill,minmax(270px,1fr))}
.subject-card{display:flex;gap:16px;align-items:flex-start;background:var(--surface);border:1.5px solid var(--border);border-radius:var(--radius);padding:20px;box-shadow:var(--shadow-sm);color:var(--text);transition:transform .15s ease,box-shadow .15s ease,border-color .15s ease}
.subject-card:hover{transform:translateY(-3px);box-shadow:var(--shadow-md);border-color:var(--border-strong);text-decoration:none}
.subject-icon{font-size:1.9rem;background:var(--primary-soft);border-radius:14px;width:56px;height:56px;display:flex;align-items:center;justify-content:center;flex:0 0 auto}
.subject-body{flex:1;min-width:0}
.subject-body h2{margin:2px 0 4px;font-size:1.25rem;display:flex;flex-wrap:wrap;align-items:baseline;gap:6px}
.subject-body h2 .count{font-size:.92rem;font-weight:600;color:var(--muted)}
.subject-body p{margin:0 0 10px;font-size:.94rem;color:var(--text-soft)}
.topic-chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:.78rem;background:var(--surface-2);border:1px solid var(--border);color:var(--text-soft);border-radius:999px;padding:3px 10px}
.subject-arrow{align-self:center;color:var(--muted);font-size:1.3rem}
.home-footer{padding:26px 20px 40px;display:flex;justify-content:flex-end}
.visit-counter{display:inline-flex;align-items:center;gap:7px;font-size:.82rem;color:var(--muted);background:var(--surface);border:1px solid var(--border);border-radius:999px;padding:5px 13px;box-shadow:var(--shadow-sm)}
.visit-counter[hidden]{display:none}
.continue-card{display:flex;align-items:center;gap:14px;background:var(--surface);border:1.5px solid var(--primary);border-radius:var(--radius);padding:14px 18px;margin:0 0 18px;box-shadow:var(--shadow-sm);color:var(--text)}
.continue-card:hover{text-decoration:none;background:var(--primary-soft)}
.cc-ico{flex:0 0 auto;width:40px;height:40px;border-radius:12px;background:var(--primary);color:#fff;display:flex;align-items:center;justify-content:center;font-size:.95rem}
.cc-body{flex:1;min-width:0;display:flex;flex-direction:column}
.cc-label{font-size:.78rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--primary-text)}
.cc-title{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cc-arrow{color:var(--muted);font-size:1.3rem}

/* =====================================================================
   4. TEMŲ PUSLAPIS
   ===================================================================== */
.crumbs{display:flex;flex-wrap:wrap;align-items:center;gap:8px;font-size:.9rem;color:var(--muted);padding:22px 0 6px}
.crumbs .sep{opacity:.6}
.crumbs a{color:var(--muted)}
.crumbs a:hover{color:var(--primary)}
.page-head{max-width:900px;padding:8px 0 20px}
.page-head h1{margin:6px 0 8px;font-size:clamp(1.6rem,4vw,2.2rem);letter-spacing:-.02em}
.page-head p{margin:0;color:var(--text-soft)}
.pick-label{font-size:.82rem;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--primary-text);background:var(--primary-soft);display:inline-block;border-radius:999px;padding:4px 12px;margin:10px 0 14px}
.topic-list{display:grid;gap:14px;max-width:880px}
.topic-card{display:flex;gap:16px;align-items:center;background:var(--surface);border:1.5px solid var(--border);border-radius:var(--radius);padding:18px 20px;box-shadow:var(--shadow-sm);color:var(--text);transition:transform .15s ease,box-shadow .15s ease,border-color .15s ease}
.topic-card:hover{transform:translateY(-2px);box-shadow:var(--shadow-md);border-color:var(--border-strong);text-decoration:none}
.topic-card .tc-num{flex:0 0 auto;width:44px;height:44px;border-radius:12px;background:var(--primary-soft);color:var(--primary-text);display:flex;align-items:center;justify-content:center;font-weight:800}
.topic-card h2{margin:0 0 3px;font-size:1.15rem}
.topic-card p{margin:0;font-size:.92rem;color:var(--text-soft)}
.topic-card .tc-meta{margin-top:6px;font-size:.82rem;color:var(--muted)}
.topic-card .tc-arrow{margin-left:auto;color:var(--muted);font-size:1.3rem}

/* =====================================================================
   5. TEMOS TURINYS: ŠONINĖ NAVIGACIJA + PAGRINDINĖ DALIS
   ===================================================================== */
.topic-layout{display:grid;grid-template-columns:292px minmax(0,1fr);gap:30px;align-items:start;max-width:1180px;margin:0 auto;padding:0 20px 90px}
.side-nav{position:sticky;top:18px;background:var(--surface);border:1.5px solid var(--border);border-radius:var(--radius);padding:14px;box-shadow:var(--shadow-sm)}
.side-head{padding:4px 8px 10px;font-size:.78rem;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.nav-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px}
.nav-link{display:flex;gap:10px;align-items:flex-start;border-radius:10px;padding:9px 10px;color:var(--text-soft);font-size:.92rem;line-height:1.4;transition:background .12s ease,color .12s ease}
.nav-link:hover{background:var(--surface-2);text-decoration:none}
.nav-link.active{background:var(--primary-soft);color:var(--primary-text);font-weight:700}
.nav-link.active .nav-num{background:var(--primary);color:#fff;border-color:var(--primary)}
.nav-num{flex:0 0 auto;width:22px;height:22px;border-radius:7px;border:1px solid var(--border);background:var(--surface-2);color:var(--muted);font-size:.76rem;font-weight:700;display:flex;align-items:center;justify-content:center;margin-top:1px}
.nav-sep{height:1px;background:var(--border);margin:10px 6px}
.nav-test{background:var(--ok-soft)}
.nav-test .nav-num{background:var(--ok);color:#fff;border-color:var(--ok)}
.nav-test.active{background:var(--ok-soft);color:var(--ok)}
.nav-test.active .nav-num{background:var(--ok);color:#fff;border-color:var(--ok)}
.nav-control{background:var(--accent-soft)}
.nav-control .nav-num{background:var(--accent);color:#fff;border-color:var(--accent)}
.nav-control.active{background:var(--accent-soft);color:var(--accent)}
.nav-control.active .nav-num{background:var(--accent);color:#fff;border-color:var(--accent)}
.nav-close{display:none;width:100%;margin-top:12px;background:var(--surface-2);border:1px solid var(--border);color:var(--text-soft);border-radius:10px;padding:10px;font:inherit;font-weight:600;cursor:pointer}
.mobile-topicbar{display:none}
.nav-backdrop{display:none}
.topic-main{min-width:0}
.topic-head{padding:22px 0 10px}
.topic-head h1{margin:4px 0 6px;font-size:clamp(1.5rem,3.6vw,2rem);letter-spacing:-.02em}
.topic-progress{display:inline-block;font-size:.82rem;color:var(--muted);background:var(--surface);border:1px solid var(--border);border-radius:999px;padding:3px 12px}
.section-content{font-size:1.02rem}
.section-content p{margin:11px 0}
.section-content h3{margin:30px 0 10px;font-size:1.18rem;letter-spacing:-.01em}
.section-content h4{margin:22px 0 8px;font-size:1.02rem}
.section-content ul,.section-content ol{margin:10px 0;padding-left:24px}
.section-content li{margin:5px 0}
.key{background:var(--warn-soft);border-radius:5px;padding:1px 5px;font-weight:600}
.pager{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-top:34px;padding-top:22px;border-top:1px solid var(--border)}

/* Mygtukai */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:9px;padding:11px 18px;border-radius:13px;border:1.5px solid transparent;font:inherit;font-weight:700;font-size:.96rem;line-height:1.25;cursor:pointer;text-decoration:none;transition:transform .12s ease,box-shadow .15s ease,background .15s ease,border-color .15s ease;min-height:46px;text-align:center}
.btn:hover{text-decoration:none}
.btn.primary{background:linear-gradient(180deg,var(--primary),var(--primary-strong));color:#fff;box-shadow:0 8px 18px -10px var(--primary),0 1px 2px rgba(20,20,43,.18)}
.btn.primary:hover{transform:translateY(-1px);box-shadow:0 12px 22px -10px var(--primary),0 2px 4px rgba(20,20,43,.2)}
.btn.primary:active{transform:translateY(0)}
.btn.ghost{background:var(--surface);border-color:var(--border);color:var(--text-soft)}
.btn.ghost:hover{border-color:var(--primary);color:var(--primary-text);background:var(--primary-soft)}
.btn-lg{font-size:1.06rem;padding:15px 28px;border-radius:15px;min-height:54px}
.btn[hidden]{display:none!important}
.review-link{display:inline-flex;align-items:center;gap:8px;margin-top:12px;padding:10px 15px;border-radius:11px;border:1.5px solid var(--border);background:var(--surface);color:var(--primary-text);font:inherit;font-weight:700;font-size:.9rem;cursor:pointer;transition:border-color .12s ease,background .12s ease}
.review-link:hover{border-color:var(--primary);background:var(--primary-soft)}

/* Kontrolinio darbo nuotraukos */
.control-grid{display:grid;gap:20px;margin:18px 0 60px}
.control-card{position:relative;background:var(--surface);border:1.5px solid var(--border);border-radius:16px;overflow:hidden;box-shadow:var(--shadow-sm)}
.control-head{display:flex;align-items:center;gap:10px;padding:13px 16px;border-bottom:1px solid var(--border);background:var(--surface-2)}
.control-head h3{margin:0;font-size:1.02rem}
.control-card img{display:block;width:100%;height:auto;background:#fff}
.control-dl{position:absolute;right:14px;bottom:14px;width:46px;height:46px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:var(--primary);color:#fff;box-shadow:var(--shadow-md);text-decoration:none;font-size:1.15rem;transition:transform .12s ease,background .15s ease}
.control-dl:hover{background:var(--primary-strong);transform:translateY(-2px);text-decoration:none;color:#fff}
.control-fallback{display:none;padding:18px 16px;font-size:.92rem;color:var(--muted)}
.control-card.img-missing .control-fallback{display:block}
.control-card.img-missing .control-dl{display:none}
.control-hint{font-size:.92rem;color:var(--muted);margin:6px 0 0}
@keyframes flashBox{0%,100%{box-shadow:0 0 0 0 rgba(79,70,229,0);background-color:transparent}35%{box-shadow:0 0 0 4px rgba(79,70,229,.5);background-color:var(--primary-soft)}70%{box-shadow:0 0 0 4px rgba(79,70,229,.35);background-color:var(--primary-soft)}}
.flash-box{animation:flashBox 1s ease-in-out 3;border-radius:16px}
.topic-cta{display:flex;gap:12px;flex-wrap:wrap;margin-top:28px;padding:18px;background:var(--surface);border:1.5px dashed var(--border-strong);border-radius:var(--radius)}

/* Turinio komponentai */
.card{background:var(--surface);border:1.5px solid var(--border);border-radius:var(--radius);padding:18px;box-shadow:var(--shadow-sm);margin:16px 0}
.callout{display:flex;gap:12px;border:1px solid var(--border);border-left:4px solid var(--primary);background:var(--surface);border-radius:12px;padding:13px 16px;margin:16px 0}
.callout .ico{flex:0 0 auto;font-size:1.15rem;line-height:1.5}
.callout p{margin:4px 0}
.callout .co-title{font-weight:700;display:block;margin-bottom:2px}
.callout.info{border-left-color:var(--primary);background:var(--primary-soft)}
.callout.success{border-left-color:var(--ok);background:var(--ok-soft)}
.callout.warn{border-left-color:var(--warn);background:var(--warn-soft)}
.callout.danger{border-left-color:var(--bad);background:var(--bad-soft)}
.grid-2{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(250px,1fr))}
.grid-3{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.mini-card{background:var(--surface);border:1.5px solid var(--border);border-radius:14px;padding:15px 16px;box-shadow:var(--shadow-sm)}
.mini-card h4{margin:0 0 6px;font-size:1rem}
.mini-card p{margin:6px 0;font-size:.94rem;color:var(--text-soft)}
.mini-card .big-ico{font-size:1.5rem}
.formula-grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(265px,1fr));margin:16px 0}
.formula-card{background:var(--surface);border:1.5px solid var(--border);border-radius:14px;padding:16px;box-shadow:var(--shadow-sm)}
.formula-card h4{margin:0 0 4px;font-size:.8rem;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.formula-card .formula{font-size:1.3rem;text-align:center;padding:12px 4px 14px;overflow-x:auto}
.symbols{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:.92rem;margin:6px 0 0}
.symbols dt{font-weight:700;white-space:nowrap}
.symbols dd{margin:0;color:var(--text-soft)}
.data-table{width:100%;border-collapse:collapse;font-size:.95rem;margin:14px 0}
.data-table th,.data-table td{border:1px solid var(--border);padding:8px 11px;text-align:left;vertical-align:top}
.data-table th{background:var(--surface-2);font-size:.88rem}
.data-table tr:nth-child(even) td{background:color-mix(in srgb,var(--surface-2) 55%,transparent)}
.figure{margin:18px 0;padding:14px;background:var(--surface);border:1.5px solid var(--border);border-radius:14px;box-shadow:var(--shadow-sm);text-align:center}
.figure svg{width:100%;max-width:640px;height:auto;color:var(--text)}
.fig-caption{font-size:.86rem;color:var(--muted);margin-top:8px}
.fig-row{display:grid;gap:10px;grid-template-columns:repeat(3,minmax(0,1fr));align-items:end}
.fig-row figure{margin:0}
.fig-row figcaption{font-size:.84rem;color:var(--muted);margin-top:2px}
.reveal{border:1.5px solid var(--border);border-radius:12px;background:var(--surface);margin:16px 0;overflow:hidden}
.reveal>summary{cursor:pointer;padding:13px 16px;font-weight:700;color:var(--primary-text);list-style:none;display:flex;align-items:center;gap:9px;font-size:.96rem}
.reveal>summary::-webkit-details-marker{display:none}
.reveal>summary::before{content:"▸";transition:transform .15s ease;color:var(--primary)}
.reveal[open]>summary::before{transform:rotate(90deg)}
.reveal>div{padding:2px 16px 15px}
.steps{margin:10px 0;padding-left:22px}
.steps li{margin:6px 0}
.tag{display:inline-block;font-size:.76rem;font-weight:700;border-radius:999px;padding:3px 10px;background:var(--surface-2);border:1px solid var(--border);color:var(--text-soft)}
.tag.green{background:var(--ok-soft);color:var(--ok);border-color:transparent}
.tag.red{background:var(--bad-soft);color:var(--bad);border-color:transparent}

/* =====================================================================
   6. TESTAS
   ===================================================================== */
.test-head{background:var(--surface);border:1.5px solid var(--border);border-radius:var(--radius);padding:20px;box-shadow:var(--shadow-sm);margin:18px 0}
.test-head h2{margin:0 0 6px;font-size:1.3rem}
.test-head p{margin:6px 0;color:var(--text-soft);font-size:.95rem}
.q-card{background:var(--surface);border:1.5px solid var(--border);border-radius:var(--radius);padding:18px;box-shadow:var(--shadow-sm);margin:0 0 16px;scroll-margin-top:20px}
.q-card.is-correct{border-color:var(--ok)}
.q-card.is-wrong{border-color:var(--bad)}
.q-meta{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.q-num{width:32px;height:32px;border-radius:10px;background:var(--primary-soft);color:var(--primary-text);font-weight:800;display:flex;align-items:center;justify-content:center}
.q-type{font-size:.78rem;color:var(--muted);border:1px solid var(--border);border-radius:999px;padding:2px 10px}
.q-badge{margin-left:auto;font-weight:800}
.q-card.is-correct .q-badge{color:var(--ok)}
.q-card.is-wrong .q-badge{color:var(--bad)}
.q-text{margin:0 0 14px;font-size:1.03rem}
.q-text p{margin:6px 0}
.q-figure{margin:0 0 14px;padding:10px;border:1px solid var(--border);border-radius:12px;background:var(--surface-2);text-align:center}
.q-figure svg{max-width:460px}
.options{display:flex;flex-direction:column;gap:9px}
.option{display:flex;gap:11px;align-items:flex-start;padding:12px 14px;border:1.5px solid var(--border);border-radius:12px;background:var(--surface);cursor:pointer;transition:border-color .12s ease,background .12s ease;min-height:44px}
.option:hover{border-color:var(--border-strong);background:var(--surface-2)}
.option input{margin:5px 0 0;flex:0 0 auto;width:17px;height:17px;accent-color:var(--primary)}
.option.correct{border-color:var(--ok);background:var(--ok-soft)}
.option.incorrect{border-color:var(--bad);background:var(--bad-soft)}
.option .opt-letter{font-weight:700;color:var(--muted);min-width:1.1em}
.option.correct input,.tf-row.correct input{accent-color:var(--ok)}
.option.incorrect input,.tf-row.incorrect input{accent-color:var(--bad)}
.option.correct .opt-letter{color:var(--ok)}
.option.incorrect .opt-letter{color:var(--bad)}
.tf-list{display:flex;flex-direction:column;gap:10px}
.tf-row{display:flex;gap:12px;justify-content:space-between;align-items:center;flex-wrap:wrap;padding:11px 14px;border:1.5px solid var(--border);border-radius:12px;background:var(--surface)}
.tf-row.correct{border-color:var(--ok);background:var(--ok-soft)}
.tf-row.incorrect{border-color:var(--bad);background:var(--bad-soft)}
.tf-text{flex:1 1 240px;font-size:.98rem}
.seg{display:flex;gap:6px}

<div id="app"></div>
<noscript><div style="max-width:640px;margin:50px auto;padding:0 20px;font-family:sans-serif"><h1>Įjunkite „JavaScript“</h1><p>Šiai mokymosi svetainei veikti reikia įjungto „JavaScript“.</p></div></noscript>
<script>
/* =====================================================================
   MOKYMOSI PLATFORMA — vienas HTML failas (GitHub Pages)
   ---------------------------------------------------------------------
   STRUKTŪRA:
   1 dalis: stiliai ir HTML karkasas
   2 dalis: pagalbinės funkcijos, diagramos, turinio duomenys (1–5 sekcijos)
   3 dalis: turinio duomenys (6–14 sekcijos) + testo klausimų bankas
   4 dalis: svetainės logika (navigacija, testas, apsilankymų skaitiklis)

   KAIP PRIDĖTI NAUJĄ DALYKĄ AR TEMĄ:
   Surask žemiau objektą DATA ir į jo masyvą subjects pridėk naują dalyką:

     {
       id: "matematika",            // naudojamas nuorodose (#/matematika)
       name: "Matematika",
       icon: "📐",
       description: "Trumpas aprašymas.",
       topics: [
         {
           id: "trupmenos",         // nuoroda (#/matematika/trupmenos)
           name: "Trupmenos",
           subtitle: "Trumpas temos aprašymas",
           sections: [
             { id: "ivadas", title: "Įvadas", html: `<p>Turinys...</p>` }
           ],
           test: { total: 12, mix: {single:3,multi:2,...}, bank: [ ...klausimai... ] }
         }
       ]
     }

   MATEMATINĖS IŠRAIŠKOS:
   Formulės rašomos tarp dvigubų laužtinių skliaustų:  [[ p = F / S ]]
   Palaikoma: x^2 (laipsnis), F_1 (indeksas), x_1^2, rho (ρ), Delta (Δ),
   sqrt(...), daugyba su *, trupmenos su /, ženklai = < > ≤ ≥ ≈.
   Paprastas tekstas NĖRA keičiamas — tik tai, kas įrašyta tarp [[ ]].
   ===================================================================== */

/* ---------------------------------------------------------------------
   PAGALBINĖS FUNKCIJOS
   --------------------------------------------------------------------- */
function escapeHtml(s){
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
function shuffle(a){
  for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));const t=a[i];a[i]=a[j];a[j]=t;}
  return a;
}
function ltPlural(n,f1,f2,f3){
  const n10=n%10,n100=n%100;
  if(n10===1&&n100!==11)return f1;
  if(n10>=2&&n10<=9&&(n100<11||n100>19))return f2;
  return f3;
}
function numLt(n){
  if(typeof n!=='number')return String(n);
  return String(n).replace('.',',');
}
function toNumberLt(v){
  if(v===null||v===undefined)return NaN;
  const s=String(v).trim().replace(/\s+/g,'').replace(',','.');
  const m=s.match(/-?\d+(\.\d+)?/);
  return m?Number(m[0]):NaN;
}

/* ---------------------------------------------------------------------
   VIDINĖ MATEMATIKOS SINTAKSĖ (žymėjimas [[ ... ]])
   --------------------------------------------------------------------- */
const GREEK={alpha:'α',beta:'β',gamma:'γ',delta:'δ',Delta:'Δ',epsilon:'ε',zeta:'ζ',eta:'η',theta:'θ',iota:'ι',kappa:'κ',lambda:'λ',mu:'μ',nu:'ν',xi:'ξ',pi:'π',rho:'ρ',sigma:'σ',tau:'τ',phi:'φ',chi:'χ',psi:'ψ',omega:'ω',Omega:'Ω'};
const MATH_SEP=['=','<','>','≤','≥','≈'];
const RE_LETTER=/[A-Za-zÀ-ÖØ-öø-ÿĀ-ž]/;
const RE_NUM=/[0-9]/;

function splitTopLevel(str){
  const out=[];let buf='';let depth=0;
  for(let i=0;i<str.length;i++){
    const ch=str[i];
    if(ch==='('||ch==='{'){depth++;buf+=ch;continue;}
    if(ch===')'||ch==='}'){depth--;buf+=ch;continue;}
    if(depth===0){
      if(MATH_SEP.indexOf(ch)!==-1){out.push({text:buf});out.push({sep:ch});buf='';continue;}
      if((ch==='+'||ch==='-')&&str[i-1]===' '&&str[i+1]===' '){out.push({text:buf});out.push({sep:ch});buf='';i++;continue;}
    }
    buf+=ch;
  }
  out.push({text:buf});
  return out;
}
function splitOnSlash(str){
  const out=[];let buf='';let depth=0;
  for(let i=0;i<str.length;i++){
    const ch=str[i];
    if(ch==='('||ch==='{'){depth++;buf+=ch;continue;}
    if(ch===')'||ch==='}'){depth--;buf+=ch;continue;}
    if(ch==='/'&&depth===0){out.push(buf);buf='';continue;}
    buf+=ch;
  }
  out.push(buf);
  return out;
}
function renderMathAtoms(str){
  let s=escapeHtml(str.trim());
  s=s.replace(/([^A-Za-z]|^)(alpha|beta|gamma|delta|Delta|epsilon|zeta|eta|theta|iota|kappa|lambda|mu|nu|xi|pi|rho|sigma|tau|phi|chi|psi|omega|Omega)(?![A-Za-z])/g,function(m,pre,name){return pre+(GREEK[name]||name);});
  s=s.replace(/\bsqrt\(/g,'√(');
  s=s.replace(/\s*\*\s*/g,' · ');
  let out='';let i=0;
  while(i<s.length){
    const ch=s[i];
    if(ch==='_'||ch==='^'){
      const tag=ch==='_'?'sub':'sup';
      let inner='',j=i+1;
      if(s[j]==='{'){
        let d=0,k=j;
        for(;k<s.length;k++){if(s[k]==='{')d++;else if(s[k]==='}'){d--;if(d===0)break;}}
        inner=s.slice(j+1,k);j=k+1;
      }else{
        let k=j;
        if((s[k]==='-'||s[k]==='+')&&RE_NUM.test(s[k+1]||''))k++;
        if(RE_NUM.test(s[k]||'')){while(RE_NUM.test(s[k]||''))k++;}
        else if(RE_LETTER.test(s[k]||'')){while(RE_LETTER.test(s[k]||''))k++;}
        inner=s.slice(j,k);j=k;
      }
      if(!inner){out+=ch;i++;continue;}
      out+='<'+tag+'>'+inner+'</'+tag+'>';
      i=j;continue;
    }
    out+=ch;i++;
  }
  return out;
}
function renderMathTerm(str){
  const parts=splitOnSlash(str);
  if(parts.length===1)return renderMathAtoms(parts[0]);
  const num=renderMathAtoms(parts[0]);
  const den=parts.length===2?renderMathAtoms(parts[1]):renderMathTerm(parts.slice(1).join('/'));
  return '<span class="frac"><span class="num">'+num+'</span><span class="den">'+den+'</span></span>';
}
function mathToHtml(src){
  let s=String(src||'').trim();
  s=s.replace(/~=/g,'≈').replace(/<=/g,'≤').replace(/>=/g,'≥');
  const tokens=splitTopLevel(s);
  return tokens.map(function(t){
    return t.sep?'<span class="msep">'+escapeHtml(t.sep)+'</span>':renderMathTerm(t.text);
  }).join('');
}
function appendPlainMath(frag,str){
  if(!str)return;
  const re=/(^|[^\w\/@])([A-Za-zΑ-Ωα-ωĀ-žΔρ])([_^])(\{[^}]+\}|[-+]?[0-9]+|[A-Za-zĀ-ž]{1,8})/g;
  let last=0,m;
  while((m=re.exec(str))){
    const base=m[2],op=m[3];
    const arg=m[4].replace(/[{}]/g,'');
    const segStart=m.index+m[1].length;
    if(segStart>last)frag.appendChild(document.createTextNode(str.slice(last,segStart)));
    frag.appendChild(document.createTextNode(base));
    const el=document.createElement(op==='_'?'sub':'sup');
    el.textContent=arg;
    frag.appendChild(el);
    last=m.index+m[0].length;
  }
  if(last<str.length)frag.appendChild(document.createTextNode(str.slice(last)));
}
function typesetMath(root){
  if(!root)return;
  const walker=document.createTreeWalker(root,NodeFilter.SHOW_TEXT,null);
  const nodes=[];
  while(walker.nextNode())nodes.push(walker.currentNode);
  for(let n=0;n<nodes.length;n++){
    const node=nodes[n];
    const text=node.nodeValue;
    if(!text)continue;
    const parent=node.parentNode;
    if(parent&&parent.closest&&parent.closest('svg,.math,code,pre,script,style,.no-math'))continue;
    const frag=document.createDocumentFragment();
    const re=/\[\[([\s\S]+?)\]\]/g;
    let m,last=0,found=false;
    while((m=re.exec(text))){
      found=true;
      if(m.index>last)appendPlainMath(frag,text.slice(last,m.index));
      const span=document.createElement('span');
      span.className='math';
      span.innerHTML=mathToHtml(m[1]);
      frag.appendChild(span);
      last=re.lastIndex;
    }
    if(last<text.length)appendPlainMath(frag,text.slice(last));
    const unchanged=frag.childNodes.length===1&&frag.firstChild.nodeType===3&&frag.firstChild.nodeValue===text;
    if(found||!unchanged)node.parentNode.replaceChild(frag,node);
  }
}

/* ---------------------------------------------------------------------
   DIAGRAMOS (SVG)
   --------------------------------------------------------------------- */
function buildGraph(){
  const x0=66,x1=384,y0=286,y1=46,hMax=40,pMax=4;
  const X=function(h){return x0+(h/hMax)*(x1-x0);};
  const Y=function(p){return y0-(p/pMax)*(y0-y1);};
  const f=function(v){return v.toFixed(1);};
  let grid='';
  for(let h=5;h<40;h+=5)grid+='<line x1="'+f(X(h))+'" y1="'+y0+'" x2="'+f(X(h))+'" y2="'+y1+'" stroke="currentColor" stroke-width="0.6" opacity="0.10"/>';
  for(let p=0.5;p<4;p+=0.5)grid+='<line x1="'+x0+'" y1="'+f(Y(p))+'" x2="'+x1+'" y2="'+f(Y(p))+'" stroke="currentColor" stroke-width="0.6" opacity="0.10"/>';
  let ticks='';
  for(let h=0;h<=40;h+=10){
    const x=f(X(h));
    ticks+='<line x1="'+x+'" y1="'+y0+'" x2="'+x+'" y2="'+(y0+7)+'" stroke="currentColor" stroke-width="1.2"/>';
    ticks+='<text x="'+x+'" y="'+(y0+22)+'" text-anchor="middle" font-size="12.5" fill="currentColor">'+h+'</text>';
  }
  for(let p=0;p<=4;p++){
    const y=f(Y(p));
    ticks+='<line x1="'+(x0-7)+'" y1="'+y+'" x2="'+x0+'" y2="'+y+'" stroke="currentColor" stroke-width="1.2"/>';
    ticks+='<text x="'+(x0-11)+'" y="'+(Number(y)+4)+'" text-anchor="end" font-size="12.5" fill="currentColor">'+p+'</text>';
  }
  let lines='';
  lines+='<line x1="'+f(x0)+'" y1="'+f(y0)+'" x2="'+f(X(4000/126))+'" y2="'+f(Y(4))+'" stroke="#d97706" stroke-width="2.6"/>';
  lines+='<line x1="'+f(x0)+'" y1="'+f(y0)+'" x2="'+f(X(40))+'" y2="'+f(Y(4))+'" stroke="#2563eb" stroke-width="2.6"/>';
  lines+='<line x1="'+f(x0)+'" y1="'+f(y0)+'" x2="'+f(X(40))+'" y2="'+f(Y(2.8))+'" stroke="#059669" stroke-width="2.6"/>';
  const labels=

function buildGauge(o){
  const cx=150,cy=172,R=116,rMinor=104,rMajor=92,rLabel=72;
  const n=Math.round(o.max/o.minorStep);
  const perMajor=Math.round(o.majorStep/o.minorStep);
  let ticks='';
  for(let i=0;i<=n;i++){
    const v=i*o.minorStep;
    const ang=(180-(v/o.max)*180)*Math.PI/180;
    const major=(i%perMajor===0);
    const r2=major?rMajor:rMinor;
    const x1=(cx+R*Math.cos(ang)).toFixed(1),y1=(cy-R*Math.sin(ang)).toFixed(1);
    const x2=(cx+r2*Math.cos(ang)).toFixed(1),y2=(cy-r2*Math.sin(ang)).toFixed(1);
    ticks+='<line x1="'+x1+'" y1="'+y1+'" x2="'+x2+'" y2="'+y2+'" stroke="currentColor" stroke-width="'+(major?2.4:1.1)+'" opacity="'+(major?0.95:0.5)+'"/>';
    if(Math.abs(v/o.labelStep-Math.round(v/o.labelStep))<1e-6){
      const lx=(cx+(rLabel-2)*Math.cos(ang)).toFixed(1),ly=(cy-(rLabel-2)*Math.sin(ang)+5).toFixed(1);
      ticks+='<text x="'+lx+'" y="'+ly+'" text-anchor="middle" font-size="13" fill="currentColor">'+v+'</text>';
    }
  }
  const ang=(180-(o.value/o.max)*180)*Math.PI/180;
  const pxv=(cx+92*Math.cos(ang)).toFixed(1),pyv=(cy-92*Math.sin(ang)).toFixed(1);
  return '<svg viewBox="0 0 300 300" role="img" aria-label="Manometro skalė su rodykle">'+
    '<path d="M '+(cx-R)+' '+cy+' A '+R+' '+R+' 0 0 1 '+(cx+R)+' '+cy+'" fill="none" stroke="currentColor" stroke-width="2" opacity="0.3"/>'+
    ticks+
    '<line x1="'+cx+'" y1="'+cy+'" x2="'+pxv+'" y2="'+pyv+'" stroke="#dc2626" stroke-width="3.2" stroke-linecap="round"/>'+
    '<circle cx="'+cx+'" cy="'+cy+'" r="8" fill="#dc2626"/>'+
    '<text x="'+cx+'" y="'+(cy+46)+'" text-anchor="middle" font-size="15" font-weight="700" fill="currentColor">'+o.unit+'</text>'+
    '</svg>';
}

function activateMapPin(i){
  const panel=document.getElementById('mapPanel');
  if(!panel)return;
  state.mapPin=i;
  document.querySelectorAll('.map-pin').forEach(function(b){
    b.classList.toggle('active',Number(b.getAttribute('data-pin'))===i);
  });
  document.querySelectorAll('.map-chip').forEach(function(b){
    b.classList.toggle('active',Number(b.getAttribute('data-pin'))===i);
  });
  panel.innerHTML=histPanelHtml(i);
  typesetMath(panel);
}
function restoreMapState(){
  if(!document.getElementById('histMap'))return;
  if(state.mapPin===null||state.mapPin===undefined)return;
  activateMapPin(state.mapPin);
}

</table>

<div class="callout info"><span class="ico">📄</span><div><span class="co-title">1 Pa tikrai mažas</span><p>Ant stalo gulintis popieriaus lapas į jį slegia tik apie 1 Pa slėgiu. Todėl didesniems slėgiams patogiau naudoti kPa arba MPa.</p></div></div>

<div class="callout danger"><span class="ico">❗</span><div><span class="co-title">Dažniausia klaida prieš skaičiuojant</span><p>Plotas dažnai pateikiamas cm². Prieš skaičiuojant <b>būtinai perskaičiuok į m²</b>: 1 cm² = 0,0001 m². Pavyzdžiui, 180 cm² = 180 · 0,0001 = 0,018 m².</p></div></div>

<details class="reveal"><summary>Pasitikrink: perskaičiuok vienetus</summary><div>
<ol class="steps">
  <li>3 kPa = 3 · 1000 Pa = <b>3000 Pa</b></li>
  <li>0,5 MPa = 0,5 · 1 000 000 Pa = <b>500 000 Pa</b></li>
  <li>20 cm² = 20 · 0,0001 m² = <b>0,002 m²</b></li>
  <li>2 N/cm² = 2 · 10 kPa = <b>20 kPa</b></li>
</ol>
</div></details>
`
},

/* ---------- 3. KAIP PADIDINTI AR SUMAŽINTI SLĖGĮ ---------- */
{
id:'kaip-padidinti-sumazinti',
title:'Jėga, plotas ir slėgis: kaip padidinti arba sumažinti slėgį?',
html:`
<p>Slėgis priklauso nuo <b>dviejų</b> dydžių – jėgos ir ploto. Todėl jį galima valdyti dviem būdais.</p>

<div class="grid-2">
  <div class="mini-card"><h4>Jei plotas nekinta</h4><p><b>Slėgis tiesiogiai proporcingas jėgai.</b> Didinant jėgą – slėgis didėja, mažinant jėgą – slėgis mažėja (tiek pat kartų).</p></div>
  <div class="mini-card"><h4>Jei jėga nekinta</h4><p><b>Slėgis atvirkščiai proporcingas plotui.</b> Didinant plotą – slėgis mažėja, mažinant plotą – slėgis didėja.</p></div>
</div>

<div class="grid-2" style="margin-top:14px">
  <div class="callout success" style="margin:0"><span class="ico">⬆️</span><div><span class="co-title">Kaip PADIDINTI slėgį?</span>
  <p>• padidinti jėgą (spausti stipriau);<br>• sumažinti plotą (galąsti, smailinti).</p>
  <p><b>Pavyzdžiai:</b> vinis, smeigtukas, peilio ašmena, adata, įrankio ašmenys (dildė, kaltas).</p></div></div>
  <div class="callout success" style="margin:0"><span class="ico">⬇️</span><div><span class="co-title">Kaip SUMAŽINTI slėgį?</span>
  <p>• sumažinti jėgą (nešti mažiau);<br>• padidinti plotą (išplatinti atramą).</p>
  <p><b>Pavyzdžiai:</b> kuprinės platūs diržai, plataus pado batai, čiužinys, stovėjimas ant abiejų kojų, pastato pamatas, traktoriaus vikšrai.</p></div></div>
</div>

<h3>Kaip skaičiuoti, kai keičiasi ir jėga, ir plotas</h3>
<p>Tarkime, kad jėga padidėjo 2 kartus, o plotas – 4 kartus. Tada:</p>
<div class="formula-card" style="text-align:center"><div class="formula">[[ p′ = (2F) / (4S) = 0,5 * (F / S) ]]</div></div>
<p>Vadinasi, slėgis <b>sumažėjo 2 kartus</b>.</p>

<details class="reveal"><summary>Pasitikrink: ką reikia daryti, kad slėgis sumažėtų 6 kartus?</summary><div>
<p>Pavyzdžiui, tokiu pat plotu veikiančią jėgą sumažinti 6 kartus <b>arba</b> (jei jėga nekinta) plotą padidinti 6 kartus. Galima ir derinti abu dydžius.</p></div></details>

<details class="reveal"><summary>Kontrolinio tipo uždavinys: jėga sumažinta 3×, plotas padidintas 4×</summary><div>
<ol class="steps">
  <li>Užrašome, kaip pasikeis slėgis: [[ p′ = (F / 3) / (4S) ]]</li>
  <li>Suprastiname: [[ p′ = (1 / 12) * (F / S) ]]</li>
  <li>Atsakymas: slėgis <b>sumažėjo 12 kartų</b>.</li>
</ol></div></details>

<details class="reveal"><summary>Kodėl žmogus, stovintis viena koja, į grindis slegia stipriau?</summary><div>
<p>Nes jėga (žmogaus svoris) nekinta, o atramos plotas sumažėja du kartus. Slėgis tampa <b>2 kartus didesnis</b>.</p></div></details>

<details class="reveal"><summary>Pasitikrink: kodėl siauresnė dildė „kanda“ stipriau?</summary><div>
<ol class="steps">
  <li>Plati dildė liečiasi su medžiaga dideliu plotu → slėgis mažas, medžiaga pašalinama lėtai.</li>
  <li>Siaura dildė liečiasi mažu plotu → slėgis daug didesnis, todėl medžiaga „kandama“ greičiau.</li>
</ol>
<p>Naudojant tą pačią jėgą didžiausias slėgis sukuriamas <b>pačia siauriausia</b> dilde, o mažiausias – <b>plačiausia</b>.</p></div></details>
`
},

/* ---------- 4. SLĖGIS SKYSČIUOSE IR DUJOSE ---------- */
{
id:'skysciai-ir-dujos',
title:'Slėgis skysčiuose ir dujose. Paskalio dėsnis',
html:`
<p>Skysčio ar dujų viduje taip pat egzistuoja slėgis. Jis atsiranda todėl, kad <b>viršutiniai skysčio sluoksniai dėl sunkio jėgos slegia apatinius</b>. Kuo giliau – tuo daugiau skysčio „užspaudžia“ ir tuo slėgis didesnis.</p>

<div class="callout info"><span class="ico">🧠</span><div><span class="co-title">Kodėl atsiranda vidinis slėgis?</span><p>Skysčio (arba dujų) molekulės laisvai juda ir slysta viena kitos atžvilgiu, todėl slėgis perduodamas <b>visomis kryptimis</b> – ne tik jėgos veikimo kryptimi.</p></div></div>

<p>Palygink: <b>kietas kūnas</b> slėgį perduoda daugiausia jėgos veikimo kryptimi, o <b>skysčiai ir dujos</b> – visomis kryptimis vienodai.</p>

<div class="callout success"><span class="ico">📜</span><div><span class="co-title">Paskalio dėsnis</span><p><b>Skysčiai ir dujos išorinį slėgį perduoda visomis kryptimis vienodai.</b></p></div></div>

<h3>Eksperimentas, kurį gali padaryti pats</h3>
<p>Į plastikinį butelį (ar stiklinę) pradurk kelias skylutes skirtinguose aukščiuose ir pripilk vandens. Vanduo trykš iš visų skylių – vadinasi, slėgis veikia visomis kryptimis. Be to, <b>iš žemiausios skylutės čiurkšlė stipriausia</b>, nes ten slėgis didžiausias.</p>

<h3>Kur tai svarbu?</h3>
<div class="grid-3">
  <div class="mini-card"><div class="big-ico">🚜</div><h4>Hidrauliniai įrenginiai</h4><p>Presai, keltuvai, ekskavatoriai, automobilių stabdžiai. Daugiau apie tai – skyriuje „Hidraulinis presas“.</p></div>
  <div class="mini-card"><div class="big-ico">🫁</div><h4>Dujų slėgis</h4><p>Padangų, balionų, oro pagalvių slėgis. Suspaustos dujos „spaudžia“ visomis kryptimis.</p></div>
  <div class="mini-card"><div class="big-ico">💉</div><h4>Švirkštas</h4><p>Stumiant stūmoklį, slėgis skystyje ar dujose perduodamas visomis kryptimis – skystis išteka per adatėlę.</p></div>
</div>

<details class="reveal"><summary>Pasitikrink: kodėl suspaudus buteliuką vanduo trykšta iš visų skylių?</summary><div><p>Nes skysčiai perduoda išorinį slėgį visomis kryptimis vienodai (Paskalio dėsnis).</p></div></details>

<details class="reveal"><summary>Pasitikrink: kodėl dujų slėgis balione vienodas visose baliono vietose?</summary><div><p>Dujų molekulės juda chaotiškai ir atsitrenkia į visas sieneles, todėl slėgis perduodamas visomis kryptimis vienodai. Įprastai pakanka laikyti, kad slėgis baliono viduje visur – toks pat.</p></div></details>
`
},

/* ---------- 5. SKYSČIO STULPELIO (HIDROSTATINIS) SLĖGIS ---------- */
{
id:'skyscio-stulpelis',
title:'Skysčio stulpelio (hidrostatinis) slėgis',
html:`
<p>Slėgį, kurį sukuria virš taško esančio skysčio stulpelio svoris, vadiname <b>skysčio stulpelio</b> (arba <b>hidrostatiniu</b>) slėgiu. Jis priklauso tik nuo <b>skysčio tankio</b> ir <b>gylio</b>.</p>

<h3>Kaip gaunama formulė</h3>
<ol class="steps">
  <li>Pradinis slėgio apibrėžimas: [[ p = F / S ]]</li>
  <li>Skysčio stulpelio svoris: [[ F = m * g ]]</li>
  <li>Masė per tankį ir tūrį: [[ m = rho * V ]], o stulpelio tūris [[ V = S * h ]]</li>
  <li>Viską sudėjus: [[ p = (rho * S * h * g) / S = rho * g * h ]]</li>
</ol>

<div class="formula-grid">
  <div class="formula-card">
    <h4>Hidrostatinio slėgio formulė</h4>
    <div class="formula">[[ p = rho * g * h ]]</div>
    <dl class="symbols">
      <dt>p</dt><dd>slėgis (Pa)</dd>
      <dt>ρ (rho)</dt><dd>skysčio tankis (kg/m³)</dd>
      <dt>g</dt><dd>laisvojo kritimo pagreitis (≈ 9,8 m/s²; uždaviniuose dažnai imama 10 m/s²)</dd>
      <dt>h</dt><dd>skysčio stulpelio aukštis – gylis nuo paviršiaus (m)</dd>
    </dl>
  </div>
</div>

<div class="callout warn"><span class="ico">💡</span><div><span class="co-title">Svarbu!</span><p>Slėgis priklauso <b>tik nuo skysčio rūšies (tankio) ir gylio</b>. Jis <b>nepriklauso</b> nuo indo formos, jo pločio ar vandens kiekio. Plačiame baseine ir siaurame vamzdyje tame pačiame gylyje slėgis bus vienodas, jei tik skystis tas pats.</p></div></div>

<h3>Grafikas: kaip slėgis priklauso nuo gylio</h3>
<div class="figure">${FIGS.graph}<div class="fig-caption">Tiesių „statumas“ priklauso nuo skysčio tankio: kuo statesnė tiesė, tuo tankesnis skystis (tuo didesnis slėgis tame pačiame gylyje).</div></div>
<p><b>Kaip skaityti grafiką:</b> kai h = 20 cm, vandens slėgis yra apie 2,0 kPa, glicerino – apie 2,5 kPa, benzino – apie 1,4 kPa. Tai sutampa su formule: p = ρ·g·h.</p>

<h3>Pavyzdžiai</h3>
<div class="grid-2">
  <div class="mini-card"><h4>12 cm vandens</h4><p>h = 0,12 m, ρ = 1000 kg/m³:</p><p>p = 1000 · 10 · 0,12 = <b>1200 Pa = 1,2 kPa</b></p></div>
  <div class="mini-card"><h4>3 m vandens</h4><p>h = 3 m:</p><p>p = 1000 · 10 · 3 = <b>30 000 Pa = 30 kPa</b></p></div>
</div>

<div class="callout info"><span class="ico">➕</span><div><span class="co-title">Bendras slėgis gylyje</span><p>Atvirame inde panardintą tašką papildomai slegia ir atmosfera. Bendras (visas) slėgis: [[ p = p_atm + rho * g * h ]]. Uždaviniuose dažniausiai prašoma apskaičiuoti tik <b>skysčio</b> sukuriamą slėgį – skaityk sąlygą atidžiai.</p></div></div>

<details class="reveal"><summary>Pasitikrink: kokiame gylyje vandenyje slėgis lygus 5 kPa?</summary><div>
<ol class="steps">
  <li>Iš formulės: [[ h = p / (rho * g) ]]</li>
  <li>h = 5000 Pa / (1000 · 10) = <b>0,5 m</b></li>
</ol></div></details>

<details class="reveal"><summary>Kodėl užtvankos siena apačioje storesnė?</summary><div><p>Nes slėgis didėja didėjant gyliui: p = ρgh. Prie pat dugno vanduo slegia kur kas stipriau nei paviršiuje, todėl siena turi būti tvirtesnė.</p></div></details>

<details class="reveal"><summary>Trys mėgintuvėliai: kuriame skysčio tankis mažiausias, jei slėgis į dugną vienodas?</summary><div>
<p>Kadangi [[ p = rho * g * h ]] ir slėgis visais atvejais vienodas, mažiausio tankio skystis turi būti <b>aukščiausio stulpelio</b>.</p>
<p>Taigi: kuo aukštesnis stulpelis prie to paties slėgio – tuo <b>mažesnis</b> skysčio tankis. Tai puikiai matyti ir grafike: statesnė p(h) tiesė reiškia didesnį tankį.</p></div></details>
`
}
,

/* ---------- 6. HIDRAULINIS PRESAS ---------- */
{
id:'hidraulinis-presas',
title:'Hidraulinės sistemos ir hidraulinis presas',
html:`
<p><b>Hidraulinė sistema</b> – tai sujungti indai su skysčiu, kuriuose, remiantis Paskalio dėsniu, slėgis perduodamas vienodai visomis kryptimis. Jei indai uždari ir skystis nesuspaudžiamas, maža jėga galima sukurti labai didelę jėgą.</p>

<div class="figure">${FIGS.press}<div class="fig-caption">Hidraulinio preso schema: mažąjį stūmoklį veikia jėga F₁, o skystis „perduoda“ slėgį didžiajam stūmokliui, kurį veikia jėga F₂.</div></div>

<div class="formula-grid">
  <div class="formula-card">
    <h4>Slėgis po mažuoju stūmokliu</h4>
    <div class="formula">[[ p = F_1 / S_1 ]]</div>
  </div>
  <div class="formula-card">
    <h4>Slėgis po didžiuoju stūmokliu</h4>
    <div class="formula">[[ p = F_2 / S_2 ]]</div>
  </div>
  <div class="formula-card">
    <h4>Pagrindinė hidraulinio preso sąlyga</h4>
    <div class="formula">[[ F_1 / S_1 = F_2 / S_2 ]]</div>
  </div>
  <div class="formula-card">
    <h4>Jėgų ir plotų santykis</h4>
    <div class="formula">[[ F_2 / F_1 = S_2 / S_1 ]]</div>
  </div>
</div>

<dl class="symbols card" style="margin-top:0">
  <dt>F₁</dt><dd>mažąjį stūmoklį veikianti jėga (N)</dd>
  <dt>S₁</dt><dd>mažojo stūmoklio plotas (m² arba cm²)</dd>
  <dt>F₂</dt><dd>didįjį stūmoklį veikianti jėga (N)</dd>
  <dt>S₂</dt><dd>didžiojo stūmoklio plotas (m² arba cm²)</dd>
  <dt>p</dt><dd>slėgis skystyje – vienodas visoje sistemoje (Pa)</dd>
</dl>

<div class="callout success"><span class="ico">🏆</span><div><span class="co-title">Auksinė taisyklė</span><p><b>Kiek kartų didesnis didžiojo stūmoklio plotas už mažojo, tiek kartų didesnė jėga veikia didįjį stūmoklį.</b></p></div></div>
<p class="muted">Nors laimima jėga, energija „iš niekur“ neatsiranda: didysis stūmoklis pakyla tiek pat kartų mažesniu atstumu, kiek jėga didesnė.</p>

<div class="callout warn"><span class="ico">📏</span><div><span class="co-title">Vienetai</span><p>Skaičiuojant abu plotai turi būti išreikšti <b>tais pačiais</b> vienetais. Jei daliji N iš cm², gauni N/cm²: [[ 1 N / cm^2 = 10 kPa ]]. Patikrink: 1 N / 0,0001 m² = 10 000 Pa.</p></div></div>

<h3>Pavyzdys (sprendžiame žingsnis po žingsnio)</h3>
<p>Preso mažojo stūmoklio plotas S₁ = 8 cm², jį veikia F₁ = 480 N jėga. Didžiojo stūmoklio plotas S₂ = 12 cm². Koks slėgis sistemoje ir kokia jėga veikia didįjį stūmoklį?</p>
<ol class="steps">
  <li>Slėgis: p = F₁ / S₁ = 480 N / 8 cm² = <b>60 N/cm² = 600 kPa</b>.</li>
  <li>Slėgis sistemoje vienodas, todėl F₂ = p · S₂ = 60 N/cm² · 12 cm² = <b>720 N</b>.</li>
  <li>Patikrinimas: S₂/S₁ = 12/8 = 1,5; F₂/F₁ = 720/480 = 1,5. Sąlyga tenkinama.</li>
</ol>

<h3>Pavyzdys: automobilio kėlimas</h3>
<p>Hidrauliniu keltuvu keliama 1,2 t masės automobilio dalis. Didžiojo stūmoklio plotas 60 kartų didesnis už mažojo. Kokios jėgos reikia mažajam stūmokliui? (g ≈ 10 m/s²)</p>
<ol class="steps">
  <li>Keliančioji jėga: F_d = m · g = 1200 kg · 10 m/s² = 12 000 N.</li>
  <li>Kadangi slėgis vienodas, jėga mažesnė tiek kartų, kiek kartų mažesnis plotas: [[ F_m = (F_d * S_m) / S_d ]]</li>
  <li>F_m = 12 000 N / 60 = <b>200 N</b>. Vadinasi, automobilio dalį pakelti pakanka 200 N jėgos!</li>
</ol>

<details class="reveal"><summary>Pasitikrink: S₁ = 2 cm², F₁ = 100 N, o didįjį stūmoklį reikia veikti 6000 N jėga. Koks turi būti didžiojo stūmoklio plotas?</summary><div>
<ol class="steps">
  <li>Slėgis: p = F₁ / S₁ = 100 N / 2 cm² = 50 N/cm².</li>
  <li>Plotas: S₂ = F₂ / p = 6000 N / 50 N/cm² = <b>120 cm²</b>.</li>
</ol></div></details>

<details class="reveal"><summary>Kur dar naudojamos hidraulinės sistemos?</summary><div><p>Automobilių stabdžiuose, ekskavatoriuose, lėktuvų važiuoklėse, zondinėse mašinose, dviračių siurbliuose (atvirkštinis veikimas), kirpyklų keltuvuose.</p></div></details>
`
},

/* ---------- 7. ATMOSFEROS SLĖGIS ---------- */
{
id:'atmosferos-slegis',
title:'Atmosferos slėgis',
html:`
<p><b>Atmosfera</b> – Žemę supantis oro sluoksnis. Jame yra apie 78 % azoto, 21 % deguonies, o likusią dalį sudaro anglies dioksidas, argonas, vandens garai ir kitos dujos. Atmosfera neturi griežtos viršutinės ribos – oro dalelės nusidriekia daugiau kaip 100 km aukštyn, tik aukštai oras labai retas.</p>

<h3>Kodėl atsiranda atmosferos slėgis?</h3>
<p>Oras turi <b>masę</b>, todėl Žemės trauka jį traukia ir oras slegia Žemės paviršių bei visus kūnus. Apatiniai atmosferos sluoksniai slegiami viršutinių, todėl žemai prie Žemės slėgis didžiausias.</p>

<div class="formula-grid">
  <div class="formula-card">
    <h4>Normalusis atmosferos slėgis</h4>
    <div class="formula">[[ 101 325 Pa = 1013 hPa ]]</div>
    <dl class="symbols">
      <dt>≈ 101,3 kPa</dt><dd>vidutinis slėgis jūros lygyje</dd>
      <dt>= 760 mm Hg</dt><dd>tiek milimetrų gyvsidabrio stulpelio atsveria oro slėgis</dd>
      <dt>= 1 atm</dt><dd>viena atmosfera</dd>
    </dl>
  </div>
</div>

<h3>Kodėl slėgis mažėja kylant aukštyn?</h3>
<p>Nes virš taško lieka <b>mažiau oro</b>: mažėja orą slegiantis stulpas, o ir pats oras aukštai yra retesnis. Netoli jūros lygio kas 100 m aukščio slėgis krinta maždaug 10 hPa (apie 1 mm Hg kas 11–13 m).</p>

<div class="callout info"><span class="ico">✈️</span><div><span class="co-title">Apytikslis skaičiavimas</span><p>Nedideliems aukščiams galima laikyti, kad oro tankis nesikeičia. Tada slėgio pokytis: [[ Delta p = rho_oro * g * h ]]. Pavyzdžiui, pakilus 500 m (kai ρ ≈ 1,2 kg/m³, g ≈ 10 m/s²): Δp = 1,2 · 10 · 500 = <b>6000 Pa = 6 kPa</b>.</p>
<p>Jei žinomas slėgių skirtumas, aukštį galima rasti atvirkščiai: [[ h = Delta p / (rho_oro * g) ]]. Pavyzdį rasi skyriuje „Uždavinių sprendimo pavyzdžiai“.</p></div></div>

<h3>Atmosferos slėgis ir žmogus</h3>
<div class="grid-2">
  <div class="mini-card"><div class="big-ico">👂</div><h4>Skausmas ausyse lėktuve</h4><p>Lėktuvui kylant aplinkos slėgis staigiai mažėja, o slėgis vidinėje ausyje kurį laiką lieka didesnis. Jis spaudžia būgnelį – taip atsiranda skausmas. Padeda rijimas ar žiovavimas – taip išsilygina slėgiai.</p></div>
  <div class="mini-card"><div class="big-ico">⛰️</div><h4>Silpnumas kalnuose</h4><p>Dideliame aukštyje oras retesnis, todėl su kiekvienu įkvėpimu gaunama mažiau deguonies, o ir slėgis mažesnis. Gali pradėti skaudėti galvą, apsvaigti, trūkti oro.</p></div>
</div>

<details class="reveal"><summary>Pasitikrink: kodėl kalno viršūnėje barometras rodo mažesnį slėgį nei papėdėje?</summary><div><p>Nes virš kalno viršūnės yra mažesnis oro stulpelis (mažiau oro) negu virš papėdės. Didesnis stulpas – didesnis slėgis.</p></div></details>

<details class="reveal"><summary>Apskaičiuok: kiek apytiksliai sumažės slėgis pakilus 200 m? (ρ ≈ 1,2 kg/m³, g ≈ 10 m/s²)</summary><div>
<ol class="steps">
  <li>Δp = ρ · g · h = 1,2 · 10 · 200</li>
  <li>Δp = <b>2400 Pa = 2,4 kPa</b></li>
</ol></div></details>
`
},

/* ---------- 8. SLĖGIO MATAVIMO PRIETAISAI ---------- */
{
id:'prietaisai',
title:'Slėgio matavimo prietaisai',
html:`
<table class="data-table">
  <tr><th>Prietaisas</th><th>Ką matuoja</th><th>Rūšys / pavyzdžiai</th></tr>
  <tr><td><b>Barometras</b></td><td>atmosferos slėgį</td><td>gyvsidabrio barometras, barometras-aneroidas, elektroninis</td></tr>
  <tr><td><b>Manometras</b></td><td>slėgį uždarose sistemose (skysčiuose, dujose)</td><td>skysčio (U formos) manometras, metalinis (ciferblatinis) manometras</td></tr>
</table>

<div class="callout warn"><span class="ico">🔎</span><div><span class="co-title">Nepainiok</span><p>Barometras – <b>atmosferai</b>. Manometras – <b>slėgiui vamzdžiuose, balionuose, įrenginiuose</b>. Dinamometras matuoja <b>jėgą</b>, ne slėgį.</p></div></div>

<h3>Skysčio (U formos) manometras</h3>
<p>Prie vienos U vamzdelio kolonėlės prijungiamos dujos (arba skystis), kita kolonėlė lieka atvira – ją veikia atmosfera. Skysčio lygių skirtumas parodo slėgių skirtumą.</p>
<div class="figure">${FIGS.manometers}<div class="fig-caption">Jei skysčio lygis atviroje kolonėlėje <b>aukščiau</b>, dujų slėgis didesnis už atmosferos. Jei <b>žemiau</b> – mažesnis. Jei lygiai – slėgiai vienodi.</div></div>
<div class="callout info"><span class="ico">🧪</span><div><span class="co-title">Mažo slėgio pokyčio matavimas</span><p>Jei reikia tiksliai išmatuoti <b>mažą</b> slėgio pokytį, į manometrą geriau pilti <b>mažesnio tankio skystį</b> (pvz., spiritą). Tada net ir nedidelis slėgio pokytis sukelia didelį skysčio stulpelių aukščių skirtumą, kurį lengviau pastebėti. Gyvsidabris tam netinka – jis labai tankus, todėl aukščių skirtumas būtų vos pastebimas.</p></div></div>
<p class="muted">Matavimo tikslumui įtakos turi aplinkos sąlygos: temperatūra (keičiasi skysčio tankis, skystis garuoja), atmosferos slėgio svyravimai, stalelio vibracija ar pasvirimas, į vamzdelį patekę oro burbuliukai.</p>

<h3>Metalinis (ciferblatinis) manometras</h3>
<p>Tokio manometro skalėje būna nurodytas daugiklis (pvz., ×10⁵ Pa). Skaitant slėgį reikia: 1) nustatyti, kiek „sveria“ viena maža padala; 2) pažiūrėti, ties kuriuo skaičiumi stovi rodyklė; 3) prisiminti skalės daugiklį.</p>
<div class="figure">${FIGS.dial}<div class="fig-caption">Pavyzdys: tarp gretimų skaičių yra 5 mažos padalos, todėl viena padala = 0,2 · 10⁵ Pa. Rodyklė yra 2 padalomis virš skaičiaus 4, vadinasi, slėgis lygus 4,4 · 10⁵ Pa = <b>440 kPa</b>.</div></div>

<details class="reveal"><summary>Pasitikrink: barometras rodo 750 mm Hg. Ar tai daugiau, ar mažiau už normą?</summary><div><p>Norma – 760 mm Hg. 750 mm Hg yra <b>mažiau</b> už normalųjį slėgį (tai apie 100 000 Pa = 100 kPa).</p></div></details>

<details class="reveal"><summary>Kodėl gyvsidabrio barometro vamzdelis toks ilgas?</summary><div><p>Gyvsidabris labai tankus (13 600 kg/m³), bet net ir jis, subalansuodamas atmosferos slėgį, pakyla į 760 mm aukštį. Jei naudotume vandenį, stulpelis būtų daugiau kaip 10 m aukščio!</p></div></details>
`
},

/* ---------- 9. ARCHIMEDO JĖGA ---------- */
{
id:'archimedas',
title:'Archimedo jėga ir plūduriavimas',
html:`
<div class="callout info" style="margin-top:0"><span class="ico">📋</span><div><span class="co-title">Pastaba</span><p>Ši tema taip pat tikrinama kontroliniame darbe: Archimedo jėgos skaičiavimas, plūduriavimo sąlygos, „kas pasikeičia panardinus kūną“.</p></div></div>

<p>Į skystį ar dujas panardintą kūną iš apačios veikia didesnis slėgis negu iš viršaus (nes giliau slėgis didesnis). Todėl atsiranda <b>aukštyn nukreipta jėga</b>, vadinama <b>Archimedo</b> (arba plūdumo) <b>jėga</b>.</p>

<div class="figure">${FIGS.balloon}<div class="fig-caption">Balioną veikia dvi svarbiausios jėgos: Archimedo jėga (aukštyn) ir sunkio jėga / svoris (žemyn).</div></div>

<div class="formula-grid">
  <div class="formula-card">
    <h4>Archimedo dėsnis</h4>
    <div class="formula">[[ F_A = rho_s * g * V ]]</div>
    <dl class="symbols">
      <dt>F_A</dt><dd>Archimedo jėga (N)</dd>
      <dt>[[ rho_s ]]</dt><dd><b>skysčio arba dujų</b> tankis (kg/m³)</dd>
      <dt>V</dt><dd>išstumto skysčio tūris = panirusios kūno dalies tūris (m³)</dd>
      <dt>g</dt><dd>laisvojo kritimo pagreitis (≈ 9,8, dažnai imama 10 m/s²)</dd>
    </dl>
  </div>
  <div class="formula-card">
    <h4>Kaip išmatuoti eksperimentu</h4>
    <div class="formula">[[ F_A = P_0 - P_s ]]</div>
    <dl class="symbols">
      <dt>P₀</dt><dd>kūno svoris ore (N), išmatuotas dinamometru</dd>
      <dt>P_s</dt><dd>kūno svoris skystyje (N)</dd>
    </dl>
  </div>
</div>

<p><b>Archimedo dėsnis:</b> skystyje ar dujose panardintą kūną veikia aukštyn nukreipta jėga, lygi kūno išstumto skysčio (dujų) svoriui.</p>
<p>Ją galima apskaičiuoti ir kaip jėgų, veikiančių apatinę bei viršutinę kūno sieneles, skirtumą: [[ F_A = F_2 - F_1 ]] (F₂ – jėga, veikianti apatinę sienelę, F₁ – viršutinę).</p>

<h3>Kas pasikeičia panardinus kūną į skystį?</h3>
<div class="grid-2">
  <div class="mini-card"><h4>Nekinta</h4><p>• kūno masė;<br>• kūną veikianti sunkio jėga;<br>• kūno tūris.</p></div>
  <div class="mini-card"><h4>Kinta</h4><p>• <b>kūno svoris skystyje</b> sumažėja (nes jį į viršų kelia Archimedo jėga). Svoryje stovintis dinamometras rodo mažesnę jėgą.</p></div>
</div>

<h3>Plūduriavimo sąlygos</h3>
<table class="data-table">
  <tr><th>Sąlyga</th><th>Kas nutinka</th><th>Paaiškinimas</th></tr>
  <tr><td>ρ_kūno &gt; ρ_skysčio</td><td>kūnas skęsta</td><td>sunkio jėga didesnė už Archimedo jėgą</td></tr>
  <tr><td>ρ_kūno &lt; ρ_skysčio</td><td>kūnas plūduriuoja paviršiuje</td><td>panirusi tik dalis kūno; plūduriuojant [[ F_A = P ]]</td></tr>
  <tr><td>ρ_kūno = ρ_skysčio</td><td>kūnas laikosi skysčio viduje</td><td>sunkio jėga lygi Archimedo jėgai</td></tr>
</table>

<div class="grid-3" style="margin-top:12px">
  <div class="mini-card"><h4>Kyla į paviršių</h4><p>Kai [[ F_A > P ]] (arba ρ_kūno &lt; ρ_skysčio).</p></div>
  <div class="mini-card"><h4>Plūduriuoja</h4><p>Kai [[ F_A = P ]] – jėgos subalansuotos.</p></div>
  <div class="mini-card"><h4>Skęsta</h4><p>Kai [[ F_A &lt; P ]] (arba ρ_kūno &gt; ρ_skysčio).</p></div>
</div>

<div class="callout info"><span class="ico">🏊</span><div><span class="co-title">Kodėl plaukdamas giliai įkvėpęs išsilaikai lengviau?</span><p>Įkvėpus krūtinė išsiplečia ir <b>kūno tūris padidėja</b>. Kadangi [[ F_A = rho_s * g * V ]], didėjant tūriui didėja ir Archimedo jėga – vanduo tave stumia stipriau į viršų.</p></div></div>

<div class="callout success"><span class="ico">🚢</span><div><span class="co-title">Kodėl plieninis laivas neskęsta?</span><p>Nes laivo korpusas išstumia labai didelį vandens tūrį, todėl Archimedo jėga didelė. Vidutinis laivo tankis (su oru viduje) mažesnis už vandens tankį.</p>
<p><b>Įkėlus daugiau krovinių</b> laivas paneria giliau: svoris padidėja, todėl padidėja išstumiamas vandens tūris – ir Archimedo jėga vėl susilygina su svoriu. Plaukdamas laivas visada tenkina sąlygą [[ F_A = P ]].</p></div></div>

<h3>Pavyzdžiai</h3>
<div class="grid-2">
  <div class="mini-card"><h4>0,5 dm³ tūrio kūnas vandenyje</h4><p>V = 0,5 dm³ = 0,0005 m³, ρ = 1000 kg/m³:</p><p>F_A = 1000 · 10 · 0,0005 = <b>5 N</b></p></div>
  <div class="mini-card"><h4>Medis vandenyje</h4><p>Medienos tankis (apie 600–800 kg/m³) mažesnis už vandens (1000 kg/m³), todėl medis plūduriuoja.</p></div>
  <div class="mini-card"><h4>Kūno tūris iš vandens lygio pokyčio</h4><p>Į vandenį panardintas kūnas pakėlė vandens lygį nuo 200 cm³ iki 350 cm³. Išstumtas tūris: 350 − 200 = 150 cm³ = 0,00015 m³.</p><p>F_A = 1000 · 10 · 0,00015 = <b>1,5 N</b>.</p></div>
</div>

<details class="reveal"><summary>Pasitikrink: kūno svoris ore 12 N, skystyje – 9 N. Kokia Archimedo jėga?</summary><div><p>F_A = P₀ − P_s = 12 N − 9 N = <b>3 N</b>.</p></div></details>

<details class="reveal"><summary>Pasitikrink: kuris kūnas paskęs vandenyje – parafinas (900 kg/m³) ar kapronas (1100 kg/m³)?</summary><div><p>Paskęs <b>kapronas</b>, nes jo tankis (1100) didesnis už vandens (1000). Parafino tankis mažesnis, todėl jis plūduriuos.</p></div></details>
`
},

<h3>Formulių lapelis</h3>

  <div class="formula-card"><h4>Archimedo jėga</h4><div class="formula">[[ F_A = rho_s * g * V ]]</div></div>

  <div class="mini-card"><h4>Paskalio dėsnis</h4><p>Skysčiai ir dujos išorinį slėgį perduoda visomis kryptimis vienodai.</p></div>

  <div class="mini-card"><h4>Normalusis atmosferos slėgis</h4><p>Vidutinis slėgis jūros lygyje: 101 325 Pa ≈ 1013 hPa = 760 mm Hg.</p></div>

/* ---------- 11. UŽDAVINIŲ SPRENDIMO PAVYZDŽIAI ---------- */
{
id:'pavyzdziai',
title:'Uždavinių sprendimo pavyzdžiai',
html:`
<p>Šie pavyzdžiai paruošti pagal kontrolinio darbo užduočių tipus. Stenkitės spręsti patys, o tada patikrinkite sprendimą.</p>

<h3>1 pavyzdys. Žmogaus slėgis į atramą</h3>
<div class="card">
<p><b>Sąlyga.</b> Žmogaus masė 86 kg. Vieno bato pado plotas 180 cm². Apskaičiuokite slėgį, kuriuo žmogus slegia grindis, kai stovi ant <b>abiejų</b> kojų. (g ≈ 10 m/s²)</p>
<ol class="steps">
  <li><b>Plotas.</b> Stovi ant abiejų kojų, todėl S = 2 · 180 cm² = 360 cm² = 0,036 m².</li>
  <li><b>Jėga.</b> F = m · g = 86 kg · 10 m/s² = 860 N.</li>
  <li><b>Slėgis.</b> p = F / S = 860 N / 0,036 m² ≈ 23 889 Pa ≈ <b>23,9 kPa</b>.</li>
  <li><b>Pastaba.</b> Jei stovėtų viena koja, plotas būtų du kartus mažesnis, o slėgis – du kartus didesnis (≈ 47,8 kPa).</li>
</ol>
</div>

<h3>2 pavyzdys. Slėgio pasikeitimas keičiant jėgą ir plotą</h3>
<div class="card">
<p><b>Sąlyga.</b> Kūną veikiančią jėgą sumažinome 3 kartus, o jos veikimo plotą sumažinome 6 kartus. Kaip pasikeitė slėgis?</p>
<ol class="steps">
  <li>Užrašome pokytį: [[ p′ = (F / 3) / (S / 6) ]]</li>
  <li>Dalijimas iš trupmenos – daugyba iš atvirkštinės: [[ p′ = (F / 3) * (6 / S) = 2 * (F / S) ]]</li>
  <li>Atsakymas: slėgis <b>padidėjo 2 kartus</b>.</li>
</ol>
</div>

<h3>3 pavyzdys. Hidraulinis presas</h3>
<div class="card">
<p><b>Sąlyga.</b> Mažojo stūmoklio plotas 4 cm², jį veikia 240 N jėga. Didžiojo stūmoklio plotas 100 cm². Raskite slėgį sistemoje ir jėgą, veikiančią didįjį stūmoklį.</p>
<ol class="steps">
  <li>p = F₁ / S₁ = 240 N / 4 cm² = 60 N/cm² = <b>600 kPa</b>.</li>
  <li>F₂ = p · S₂ = 60 N/cm² · 100 cm² = <b>6000 N</b>.</li>
  <li>Patikrinimas: plotas didesnis 25 kartus (100/4), jėga irgi 25 kartus didesnė (6000/240 = 25).</li>
</ol>
</div>

<h3>4 pavyzdys. Slėgis gylyje (naras)</h3>
<div class="card">
<p><b>Sąlyga.</b> Naras dirba 40 m gylyje. Vandens tankis 1000 kg/m³, g ≈ 10 m/s². Apskaičiuokite vandens slėgį ir jėgą, veikiančią 1 dm² ploto naro paviršiaus dalį.</p>
<ol class="steps">
  <li>p = ρ · g · h = 1000 · 10 · 40 = 400 000 Pa = <b>400 kPa</b>.</li>
  <li>Plotas: S = 1 dm² = 0,01 m².</li>
  <li>F = p · S = 400 000 Pa · 0,01 m² = <b>4000 N</b>.</li>
  <li><b>Pastaba.</b> Jei reikėtų bendro slėgio, pridėtume atmosferos slėgį: 400 kPa + 101 kPa ≈ 501 kPa. Skaityk, ko prašoma sąlygoje.</li>
</ol>
</div>

<h3>5 pavyzdys. Atmosferos slėgio pokytis</h3>
<div class="card">
<p><b>Sąlyga.</b> Kylant į 300 m aukštį atmosferos slėgis sumažėja. Apskaičiuokite slėgio pokytį, kai oro tankis ρ ≈ 1,2 kg/m³, g ≈ 10 m/s².</p>
<ol class="steps">
  <li>Nedideliame aukštyje galime laikyti, kad tankis nekinta: [[ Delta p = rho_oro * g * h ]]</li>
  <li>Δp = 1,2 · 10 · 300 = 3600 Pa = <b>3,6 kPa</b>.</li>
  <li>Atsakymas: slėgis sumažėjo ≈ 3,6 kPa.</li>
</ol>
</div>

<h3>6 pavyzdys. Archimedo jėga ir kūno svoris</h3>
<div class="card">
<p><b>Sąlyga.</b> Į vandenį visiškai panardintą medinį kūną (ρ = 800 kg/m³) veikia 5 N Archimedo jėga. Vandens tankis 1000 kg/m³, g ≈ 10 m/s². Raskite kūno svorį ore.</p>
<ol class="steps">
  <li>Iš Archimedo jėgos randame kūno (visiškai panirusios dalies) tūrį: [[ V = F_A / (rho_v * g) = 5 / (1000 * 10) = 0,0005 m^3 ]]</li>
  <li>Kūno masė: m = ρ_med · V = 800 kg/m³ · 0,0005 m³ = 0,4 kg.</li>
  <li>Svoris ore: P₀ = m · g = 0,4 · 10 = <b>4 N</b>.</li>
  <li><b>Pastaba.</b> Paleistas kūnas iškiltų į paviršių, nes medienos tankis mažesnis už vandens – plūduriuodamas jis išstumtų mažiau vandens.</li>
</ol>
</div>

<h3>7 pavyzdys. Grafiko skaitymas</h3>
<div class="card">
<div class="figure" style="margin-top:0">${FIGS.graph}</div>
<p><b>Užduotis.</b> Pagal grafiką nustatykite, koks yra vandens stulpelio slėgis 20 cm gylyje. Kuris skystis tame pačiame gylyje sukelia didžiausią slėgį?</p>
<ol class="steps">
  <li>Tiesėje „vanduo“ randame tašką, kai h = 20 cm → p ≈ <b>2,0 kPa</b>.</li>
  <li>Patikriname formule: p = 1000 · 10 · 0,2 = 2000 Pa = 2,0 kPa. Sutampa.</li>
  <li>Didžiausią slėgį sukelia <b>glicerinas</b> – jo tiesė statausia (tankis didžiausias).</li>
</ol>
</div>

<h3>8 pavyzdys. Plūduriavimo sąlygos</h3>
<div class="card">
<p><b>Sąlyga.</b> Duotos medžiagos: ledas (900 kg/m³), kapronas (1100 kg/m³), betonas (2200 kg/m³), aliuminis (2700 kg/m³). Kuri medžiaga plūduriuos vandenyje (ρ = 1000 kg/m³)?</p>
<ol class="steps">
  <li>Plūduriuoja tos medžiagos, kurių tankis <b>mažesnis</b> už vandens tankį.</li>
  <li>900 &lt; 1000, 1100 &gt; 1000, 2200 &gt; 1000, 2700 &gt; 1000.</li>
  <li>Atsakymas: vandenyje plūduriuos <b>ledas</b>.</li>
</ol>
</div>

<h3>9 pavyzdys. Kalno aukštis iš slėgių skirtumo</h3>
<div class="card">
<p><b>Sąlyga.</b> Kalno papėdėje ir viršūnėje atmosferos slėgių skirtumas yra 4515 Pa. Koks kalno aukštis? Laikykime, kad oro tankis ρ ≈ 1,275 kg/m³, g ≈ 9,8 m/s².</p>
<ol class="steps">
  <li>Nedideliame aukštyje slėgio pokytis: [[ Delta p = rho_oro * g * h ]].</li>

/* ---------- 1. MECHANINIS DARBAS ---------- */
{
id:'mechaninis-darbas',
title:'Mechaninis darbas',
html:`
<p><b>Mechaninis darbas</b> – fizikinis dydis, lygus kūną veikiančios jėgos modulio ir to kūno poslinkio sandaugai, kai jėgos ir poslinkio kryptys sutampa.</p>

<div class="formula-card">
  <h4>Darbo formulė</h4>
  <div class="formula">[[ A = F * s ]]</div>
  <dl class="symbols">
    <dt>A</dt><dd>mechaninis darbas (džauliais, J)</dd>
    <dt>F</dt><dd>jėga (niutonais, N)</dd>
    <dt>s</dt><dd>poslinkis (metrais, m)</dd>
  </dl>
</div>

<div class="callout info"><span class="ico">📌</span><div><span class="co-title">Kada darbas atliekamas?</span><p>Darbas atliekamas tada, kai <b>jėgos veikiamas kūnas pasislenka</b> kokiu nors atstumu. Reikia abiejų dalykų: jėgos ir poslinkio.</p></div></div>

<h3>Kada darbas NEatliekamas?</h3>
<div class="grid-2">
  <div class="mini-card"><h4>1. Kūno neveikia jėga</h4><p>Pvz., kosmose iš inercijos skrendantis akmuo: jis juda, bet jo niekas nestumia.</p></div>
  <div class="mini-card"><h4>2. Kūnas nepasislenka</h4><p>Pvz., žmogus stumia sieną arba laiko sunkų krepšį vietoje – jėga yra, bet poslinkis lygus 0, todėl A = 0.</p></div>
  <div class="mini-card"><h4>3. Kūnas juda iš inercijos tolygiai</h4><p>Pvz., ledu be trinties slystanti ritulys juda tolygiai – judėjimo kryptimi jo neveikia jokia jėga.</p></div>
  <div class="mini-card"><h4>4. Jėga statmena poslinkiui</h4><p>Pvz., horizontaliu stalu riedančio kamuolio <b>sunkio jėga darbo neatlieka</b>: ji nukreipta žemyn, o kamuolys juda horizontaliai (90° kampas).</p></div>
</div>
<p class="muted">Taip pat darbas lygus nuliui, kai kūnas juda uždara trajektorija ir grįžta į pradinį tašką (pvz., sunkio jėgos darbas, kai kamuolys išmetamas ir vėl pagaunamas tame pačiame aukštyje).</p>

<h3>Kai jėga veikia kampu</h3>
<p>Jei jėga su poslinkio kryptimi sudaro kampą α, darbą atlieka tik ta jėgos dalis, kuri nukreipta judėjimo kryptimi:</p>
<div class="figure">${FIGS.workAngle}<div class="fig-caption">Pvz., rogutės traukiamos virve, kuri pakelta kampu α į horizontą.</div></div>
<div class="formula-card" style="text-align:center"><div class="formula">[[ A = F * s * cos alpha ]]</div><p class="muted" style="margin:0;font-size:.9rem">Kai α = 0° – cos α = 1, taigi A = F · s. Kai α = 90° – cos α = 0, taigi A = 0.</p></div>

<h3>Darbo vienetas – džaulis</h3>
<p><b>1 J</b> – tai darbas, kurį atlieka 1 N jėga, kūną pastūmusi 1 m. [[ 1 J = 1 N * 1 m ]]. Dideli darbai: 1 kJ = 1000 J, 1 MJ = 1 000 000 J.</p>

<h3>Pavyzdys</h3>
<p>Ūkininkas iš 5 m gylio šulinio iškėlė 100 N svorio kibirą. Kokį darbą jis atliko?</p>
<ol class="steps">
  <li>Kibirą kelia jėga, lygi jo svoriui: F = 100 N. Poslinkis s = h = 5 m.</li>
  <li>A = F · s = 100 N · 5 m = <b>500 J</b>.</li>
</ol>

<div class="callout warn"><span class="ico">⚠️</span><div><span class="co-title">Keliant kūną</span><p>Kai kūnas keliamas tolygiai, keliamoji jėga lygi sunkio jėgai: [[ F = m * g ]]. Todėl darbas keliant kūną: [[ A = m * g * h ]].</p></div></div>

<details class="reveal"><summary>Pasitikrink: ar atlieka darbą žmogus, stovintis su kuprine ant pečių?</summary><div><p><b>Ne.</b> Žmogus veikia kuprinę jėga, bet kuprinė nepasislenka (s = 0), todėl A = F · 0 = 0. Žmogus pavargsta dėl raumenų darbo, bet mechaninio darbo kuprinei jis neatlieka.</p></div></details>
<details class="reveal"><summary>Pasitikrink: pateik pavyzdžių, kada darbas atliekamas</summary><div><ul><li>Arklys traukia vežimą.</li><li>Kranas kelia krovinį.</li><li>Žmogus lipa laiptais.</li><li>Krentantį kamuolį veikia sunkio jėga ir jis juda žemyn – sunkio jėga atlieka darbą.</li></ul></div></details>
`

<p><b>Galia</b> – fizikinis dydis, kuris nusako <b>darbo atlikimo spartą</b>. Galia lygi darbui, atliktam per vienetinį laiko tarpą (per 1 s).</p>

<div class="formula-card">
  <h4>Galios formulė</h4>
  <div class="formula">[[ N = A / t ]]</div>
  <dl class="symbols">

    <dt>A</dt><dd>mechaninis darbas (J)</dd>
