function reviewButtonHtml(q){
  const cur=state.current||{};
  const subj=findSubject(cur.subjectId);
  const top=findTopic(subj,cur.topicId);
  const firstId=(top&&top.sections&&top.sections[0])?top.sections[0].id:'';
  /* guessTopic() atpažįsta tik „Slėgio“ temos sekcijas */
  let topicId=q.topic||(top&&top.id==='slegis'?guessTopic(q):firstId);
  let sec=sectionById(subj,top,topicId);
  if(!sec){topicId=firstId;sec=sectionById(subj,top,topicId);}
  const label=sec?('📖 Pasikartoti: '+escapeHtml(sec.title)):'📖 Pasikartoti temą';
  return '<button type="button" class="review-link" data-action="review-topic" data-section="'+topicId+'">'+label+'</button>';
}
function appClick(e){
  const actionEl=e.target.closest?e.target.closest('[data-action]'):null;
  if(actionEl){
    const action=actionEl.getAttribute('data-action');
    if(action==='open-nav'){toggleNav(true);return;}
    if(action==='close-nav'){toggleNav(false);return;}
    if(action==='check-test'){checkTest();return;}
    if(action==='retry-test'){
      const cur=state.current||{};
      if(cur.subjectId&&cur.topicId){
        const k=testStorageKey(cur.subjectId,cur.topicId);
        delete state.testRuns[k];
        try{sessionStorage.removeItem(k);}catch(err){}
      }
      applyRoute();
      return;
    }
    if(action==='map-pin'){activateMapPin(Number(actionEl.getAttribute('data-pin')));return;}
    if(action==='goto-q'){
      const card=document.getElementById('q'+actionEl.getAttribute('data-q'));
      if(card)card.scrollIntoView({block:'start'});
      return;
    }
    if(action==='review-topic'){
      const secId=actionEl.getAttribute('data-section');
      const cur=state.current||{};
      if(cur.subjectId&&cur.topicId&&secId){
        toggleNav(false);
        state.pendingFlash=secId;
        state.returnToTest={subjectId:cur.subjectId,topicId:cur.topicId};
        const target='#/'+cur.subjectId+'/'+cur.topicId+'/s/'+secId;
        if(location.hash===target)applyRoute();
        else location.hash=target;
      }
      return;
    }
  }
  if(e.target.closest&&e.target.closest('.side-nav a'))toggleNav(false);
}
document.addEventListener('keydown',function(e){if(e.key==='Escape')toggleNav(false);});

/* ---------- APSILANKYMŲ SKAITIKLIS ----------
   Skaitiklis rodo bendrą svetainės apsilankymų skaičių.
   +1 pridedamas ne dažniau kaip KARTĄ PER MINUTĘ tam pačiam
   lankytojui: jei puslapis atnaujinamas anksčiau – skaičius tik
   parodomas be pridėjimo. Praėjus minutei, naujas apsilankymas
   vėl prideda +1.
   Naudojamas nemokamas „Abacus“ skaitiklis (nereikia registracijos).
   Jeigu jis nepasiekiamas – bandomas atsarginis „VisitorBadge“ servisas.
   Jei neveikia nė vienas, rodoma paskutinė žinoma reikšmė (jei tokia
   buvo), o kitu atveju skaitiklis lieka paslėptas. Jokių asmeninių
   duomenų nerenkama – naršyklėje saugomas tik laikas ir paskutinė
   matyta skaičiaus reikšmė. */
const VISITS={
  namespace:'eduvia-mokymosi-platforma',
  key:'apsilankymai',
  badgePath:'eduvia-mokymosi-platforma',
  minGapMs:60000,
  lastTimeKey:'eduvia-visit-last-ms',
  lastValueKey:'eduvia-visit-cached-value'
};
function storageGet(key){
  try{return localStorage.getItem(key);}catch(err){return null;}
}
function storageSet(key,val){
  try{localStorage.setItem(key,val);}catch(err){/* ignoruojama */}
}
async function fetchJsonTimeout(url,timeoutMs){
  const ctrl=new AbortController();
  const timer=setTimeout(function(){ctrl.abort();},timeoutMs||7000);
  try{
    const r=await fetch(url,{signal:ctrl.signal,cache:'no-store'});
    if(!r.ok)throw new Error('HTTP '+r.status);
    return await r.json();
  }finally{clearTimeout(timer);}
}
async function fetchTextTimeout(url,timeoutMs){
  const ctrl=new AbortController();
  const timer=setTimeout(function(){ctrl.abort();},timeoutMs||7000);
  try{
    const r=await fetch(url,{signal:ctrl.signal,cache:'no-store'});
    if(!r.ok)throw new Error('HTTP '+r.status);
    return await r.text();
  }finally{clearTimeout(timer);}
}
async function initVisitCounter(){
  const now=Date.now();
  const lastMs=parseInt(storageGet(VISITS.lastTimeKey)||'0',10)||0;
  const cachedValue=parseInt(storageGet(VISITS.lastValueKey)||'0',10)||0;
  const canCount=(now-lastMs)>=VISITS.minGapMs;
  let value=null;
  try{
    if(canCount){
      try{
        const j=await fetchJsonTimeout('https://abacus.jasoncameron.dev/hit/'+VISITS.namespace+'/'+VISITS.key);
        if(j&&typeof j.value==='number')value=j.value;
      }catch(err){
        try{
          const svg=await fetchTextTimeout('https://api.visitorbadge.io/api/visitors?path='+encodeURIComponent(VISITS.badgePath)+'&label=apsilankymai');
          const m=svg.match(/aria-label="[^"]*?([\d][\d\s.,]*)"/);
          if(m){
            const digits=m[1].replace(/[^\d]/g,'');
            if(digits)value=parseInt(digits,10);
          }
        }catch(err2){/* tyliai ignoruojama */}
      }
      if(value!==null)storageSet(VISITS.lastTimeKey,String(now));
    }else{
      try{
        const j=await fetchJsonTimeout('https://abacus.jasoncameron.dev/get/'+VISITS.namespace+'/'+VISITS.key);
        if(j&&typeof j.value==='number')value=j.value;
      }catch(err){/* tyliai ignoruojama */}
    }
  }catch(err){/* skaitiklis lieka paslėptas */}
  if(value===null&&cachedValue>0)value=cachedValue;
  if(value!==null&&isFinite(value)){
    state.visits=value;
    storageSet(VISITS.lastValueKey,String(value));
  }
  renderCounter();
}
function renderCounter(){
  const el=document.getElementById('visitCounter');
  if(!el)return;
  if(state.visits===null||state.visits===undefined){el.hidden=true;return;}
  let shown=String(state.visits);
  try{shown=state.visits.toLocaleString('lt-LT');}catch(err){}
  el.hidden=false;
  el.textContent='👁 '+shown+' apsilankymai';
}

document.getElementById('app').addEventListener('click',appClick);
document.getElementById('app').addEventListener('change',function(e){
  const run=state.current&&state.current.testRun;
  if(run&&!run.checked&&e.target&&e.target.closest&&e.target.closest('#testForm'))collectAnswers(run);
});
document.getElementById('app').addEventListener('input',function(e){
  const run=state.current&&state.current.testRun;
  if(run&&!run.checked&&e.target&&e.target.closest&&e.target.closest('#testForm'))collectAnswers(run);
});
window.addEventListener('hashchange',applyRoute);
applyRoute();
initVisitCounter();
</script>
