<p>Iš formulės galima išreikšti ir kitus dydžius:</p>
<div class="formula-grid">
  <div class="formula-card"><h4>Darbas</h4><div class="formula">[[ A = N * t ]]</div><p class="muted" style="margin:0;font-size:.9rem">Kai žinoma galia ir laikas.</p></div>
  <div class="formula-card"><h4>Laikas</h4><div class="formula">[[ t = A / N ]]</div><p class="muted" style="margin:0;font-size:.9rem">Kai žinomas darbas ir galia.</p></div>
</div>

<h3>Galios vienetai</h3>
<table class="data-table">
  <tr><th>Vienetas</th><th>Kiek tai vatų</th><th>Pavyzdys</th></tr>
  <tr><td>1 W (vatas)</td><td>1 J/s</td><td>žmogus lėtai eina – apie 50–100 W</td></tr>
  <tr><td>1 kW (kilovatas)</td><td>1000 W</td><td>lifto variklis – kelios dešimtys kW</td></tr>
  <tr><td>1 MW (megavatas)</td><td>1 000 000 W</td><td>elektrinės, pvz., Kruonio HAE</td></tr>
</table>

<div class="callout info"><span class="ico">🏃</span><div><span class="co-title">Bėgikas ar einantis žmogus?</span><p>Jei bėgikas ir lėtai einantis žmogus užlipa į tą patį aukštį (atlieka tą patį darbą), <b>bėgiko galia didesnė</b>, nes jis tą darbą atlieka per trumpesnį laiką. Kuo greičiau atliekamas darbas – tuo didesnė galia.</p></div></div>

<h3>Kaip rasti, į kokį aukštį liftas pakels krovinį?</h3>
<p>Tai dažnas kontrolinio uždavinys. Žinoma variklio galia N, krovinio masė m ir laikas t.</p>
<ol class="steps">
  <li>Darbas, kurį atlieka variklis: [[ A = N * t ]].</li>
  <li>Šis darbas sunaudojamas kroviniui pakelti: [[ A = m * g * h ]].</li>
  <li>Sulyginame ir išreiškiame aukštį: [[ h = N * t / (m * g) ]].</li>
</ol>

<h3>Pavyzdys</h3>
<p>Lifto variklio galia 60 kW. Į kokį aukštį jis gali pakelti 150 kg krovinį per 5 s? (g ≈ 10 m/s²)</p>
<ol class="steps">
  <li>N = 60 kW = 60 000 W.</li>
  <li>A = N · t = 60 000 W · 5 s = 300 000 J.</li>
  <li>h = A / (m · g) = 300 000 / (150 · 10) = <b>200 m</b>.</li>
</ol>

<div class="callout danger"><span class="ico">❗</span><div><span class="co-title">Vienetai prieš skaičiuojant</span><p>Galią perskaičiuok į vatus (kW → W, · 1000), laiką – į sekundes (1 min = 60 s, 1 h = 3600 s), masę – į kilogramus (g → kg, : 1000).</p></div></div>

<details class="reveal"><summary>Pasitikrink: per 2 minutes ūkininkas atliko 500 J darbą. Kokia jo galia?</summary><div>
<ol class="steps"><li>t = 2 min = 120 s.</li><li>N = A / t = 500 / 120 ≈ <b>4,2 W</b>.</li></ol>
</div></details>
<details class="reveal"><summary>Pasitikrink: vaiko galia 100 W. Per kiek laiko jis pakels 400 g kamuolį į 2 m aukštį?</summary><div>
<ol class="steps"><li>m = 400 g = 0,4 kg; F = m · g = 0,4 · 10 = 4 N.</li><li>A = F · s = 4 N · 2 m = 8 J.</li><li>t = A / N = 8 / 100 = <b>0,08 s</b>.</li></ol>
</div></details>
`
},

/* ---------- 3. POTENCINĖ IR KINETINĖ ENERGIJA ---------- */
{
id:'energija',
title:'Mechaninė energija: potencinė ir kinetinė',
html:`
<p><b>Mechaninė energija</b> – fizikinis dydis, rodantis, kokį darbą gali atlikti kūnas arba kūnų sistema. Energija, kaip ir darbas, matuojama <b>džauliais (J)</b>.</p>

<div class="grid-2">
  <div class="mini-card"><div class="big-ico">⛰️</div><h4>Potencinė energija (E_p)</h4><p>Energija, kuri priklauso nuo sąveikaujančių kūnų arba to paties kūno dalių <b>padėties</b>. Ją turi pakeltas kūnas, suspausta spyruoklė, įtemptas lankas.</p></div>
  <div class="mini-card"><div class="big-ico">🏃</div><h4>Kinetinė energija (E_k)</h4><p>Kūno <b>judėjimo</b> energija. Ją turi kiekvienas judantis kūnas. Stovintis kūnas kinetinės energijos neturi.</p></div>
</div>

<div class="formula-grid">
  <div class="formula-card">
    <h4>Pakelto kūno potencinė energija</h4>
    <div class="formula">[[ E_p = m * g * h ]]</div>
    <dl class="symbols">
      <dt>m</dt><dd>masė (kg)</dd>
      <dt>g</dt><dd>laisvojo kritimo pagreitis (≈ 10 m/s²)</dd>
      <dt>h</dt><dd>aukštis (m)</dd>
    </dl>
  </div>
  <div class="formula-card">
    <h4>Kinetinė energija</h4>
    <div class="formula">[[ E_k = m * v^2 / 2 ]]</div>
    <dl class="symbols">
      <dt>m</dt><dd>masė (kg)</dd>
      <dt>v</dt><dd>greitis (m/s)</dd>
    </dl>
  </div>
</div>

<div class="callout warn"><span class="ico">💡</span><div><span class="co-title">Greitis – kvadratu!</span><p>Padidinus greitį 2 kartus, kinetinė energija padidėja <b>4 kartus</b> (2² = 4). Padidinus masę 2 kartus – kinetinė energija padidėja tik 2 kartus.</p></div></div>

<h3>Kada kūnas turi kokią energiją?</h3>
<table class="data-table">
  <tr><th>Atvejis</th><th>Sąlyga</th><th>Pavyzdžiai</th></tr>
  <tr><td><b>Tik kinetinę</b></td><td>kūnas juda žemės paviršiuje (h = 0)</td><td>važiuojantis automobilis, rieda kamuolys, bėga maratonininkas, vaikai važinėjasi riedučiais</td></tr>
  <tr><td><b>Tik potencinę</b></td><td>kūnas nejuda, bet yra pakeltas arba deformuotas (v = 0)</td><td>obuolys kabo ant šakos, lizdas medyje, įtemptas lankas, suspausta spyruoklė, žmogus stovi ant kalno</td></tr>
  <tr><td><b>Abi kartu</b></td><td>kūnas juda ir yra aukštai</td><td>skrendantis paukštis ar lėktuvas, žmogus leidžiasi su parašiutu, vaikai leidžiasi rogutėmis nuo kalno</td></tr>
</table>

<h3>Pavyzdžiai</h3>
<div class="card">
<p><b>1.</b> 450 g kamuolys pakeltas į 8 m aukštį. Jo potencinė energija:</p>
<p>[[ E_p = m * g * h = 0,45 * 10 * 8 = 36 J ]]</p>
<p><b>2.</b> 6,6 t palydovas skrieja 7,8 km/s greičiu. Jo kinetinė energija:</p>
<ol class="steps">
  <li>m = 6,6 t = 6600 kg; v = 7,8 km/s = 7800 m/s.</li>
  <li>[[ E_k = 6600 * 7800^2 / 2 ]] = 200 772 000 000 J ≈ <b>2 · 10¹¹ J</b>.</li>
</ol>
</div>

<details class="reveal"><summary>Pasitikrink: ar gali du skirtingos masės kūnai turėti vienodą potencinę energiją?</summary><div><p><b>Gali.</b> [[ E_p = m * g * h ]], todėl lengvesnis kūnas turi būti pakeltas aukščiau. Pvz., 1 kg kūnas 10 m aukštyje ir 2 kg kūnas 5 m aukštyje abu turi E_p = 100 J.</p></div></details>
<details class="reveal"><summary>Pasitikrink: kokią energiją turi skrendantis lėktuvas?</summary><div><p><b>Abi:</b> kinetinę (nes juda) ir potencinę (nes yra pakeltas virš žemės).</p></div></details>
`
},

/* ---------- 4. ENERGIJOS TVERMĖS DĖSNIS ---------- */
{
id:'tvermes-desnis',
title:'Pilnutinė energija ir energijos tvermės dėsnis',
html:`
<p><b>Pilnutinė mechaninė energija</b> – tai kūno potencinės ir kinetinės energijos suma:</p>
<div class="formula-card" style="text-align:center"><div class="formula">[[ E = E_p + E_k ]]</div></div>

<div class="callout success"><span class="ico">📜</span><div><span class="co-title">Energijos tvermės dėsnis</span><p><b>Uždaroje sistemoje, vykstant bet kokiems mechaniniams procesams, kūno pilnutinė mechaninė energija išlieka pastovi.</b> Energija neatsiranda iš nieko ir neišnyksta – ji tik virsta iš vienos rūšies į kitą.</p></div></div>

<p>Todėl bet kuriuose dviejuose taškuose (kai nepaisome oro pasipriešinimo ir trinties):</p>
<div class="formula-card" style="text-align:center"><div class="formula">[[ E_{p1} + E_{k1} = E_{p2} + E_{k2} ]]</div></div>

<h3>Krentantis kamuoliukas</h3>
<p>500 g kamuoliukas paleidžiamas laisvai kristi iš 6 m aukščio (g ≈ 10 m/s²).</p>
<div class="figure">${FIGS.fall}<div class="fig-caption">Krentant potencinė energija mažėja, o kinetinė – tiek pat didėja. Pilnutinė energija visą laiką ta pati – 30 J.</div></div>
<ol class="steps">
  <li><b>Viršuje</b> (paleidimo momentu): E_p = m · g · h = 0,5 · 10 · 6 = 30 J; E_k = 0 (greitis lygus 0).</li>
  <li><b>Pilnutinė energija:</b> E = E_p + E_k = 30 + 0 = <b>30 J</b>.</li>
  <li><b>3 m aukštyje</b> (pusiaukelėje): E_p = 0,5 · 10 · 3 = 15 J, todėl E_k = 30 − 15 = <b>15 J</b>.</li>
  <li><b>Prie pat žemės:</b> E_p = 0 (h = 0), E_k = <b>30 J</b> – visa potencinė energija virto kinetine.</li>
  <li><b>Greitis prie žemės:</b> iš [[ E_k = m * v^2 / 2 ]] → [[ v = sqrt(2 * E_k / m) = sqrt(2 * 30 / 0,5) ]] ≈ <b>11 m/s</b>.</li>
</ol>

<h3>Greitis be masės</h3>
<p>Kai kūnas krenta iš aukščio h be pradinio greičio, iš [[ m * g * h = m * v^2 / 2 ]] masė susiprastina:</p>
<div class="formula-grid">
  <div class="formula-card"><h4>Greitis nukritus</h4><div class="formula">[[ v = sqrt(2 * g * h) ]]</div></div>
  <div class="formula-card"><h4>Aukštis, į kurį pakils mestas aukštyn kūnas</h4><div class="formula">[[ h = v^2 / (2 * g) ]]</div></div>
</div>
<p class="muted">Pvz., šuolininkas šoka į vandenį nuo 5 m bokšto: [[ v = sqrt(2 * 10 * 5) = sqrt(100) = 10 m/s ]].</p>

<h3>Kaip kinta energija?</h3>
<div class="grid-2">
  <div class="mini-card"><h4>⬇️ Kūnas krenta / rieda žemyn</h4><p>E_p <b>mažėja</b> (mažėja aukštis), E_k <b>didėja</b> (didėja greitis), E – <b>nekinta</b>. Potencinė energija virsta kinetine.</p></div>
  <div class="mini-card"><h4>⬆️ Kūnas kyla / rieda aukštyn</h4><p>E_p <b>didėja</b> (didėja aukštis), E_k <b>mažėja</b> (mažėja greitis), E – <b>nekinta</b>. Kinetinė energija virsta potencine.</p></div>
</div>

<details class="reveal"><summary>Ar galėtų kamuoliukas atšokęs pakilti į didesnį aukštį, nei iš kurio krito?</summary><div><p><b>Negalėtų.</b> Pagal energijos tvermės dėsnį pilnutinė energija nepadidėja. Viršutiniame taške visa energija yra potencinė, o didesniam aukščiui reikėtų daugiau energijos, nei kamuoliukas turėjo pradžioje. Be nuostolių jis pakiltų lygiai į tą patį aukštį, o realiai – į mažesnį (dalis energijos virsta šiluma).</p></div></details>
`
},

/* ---------- 5. KALNELIS ---------- */
{
id:'kalnelis',
title:'Kamuoliukas ant kalnelio (energija taškuose)',
html:`
<p>Tai vienas dažniausių kontrolinio uždavinių. Kamuoliukas pradeda riedėti nuo kalnelio <b>be pradinio greičio</b> (1 taškas). 5 taške jis vėl pakyla į tą patį aukštį. Trinties nepaisome.</p>

<div class="figure">${FIGS.hill}<div class="fig-caption">Kamuoliuko kelias nuo 1 iki 5 taško. 3 taškas – žemiausias.</div></div>

<h3>Sprendimo taisyklės</h3>
<ol class="steps">
  <li><b>Pilnutinė energija E visuose taškuose vienoda</b> (trinties nėra). Jei žinoma E viename taške – ji tokia pati visur.</li>
  <li><b>1 taškas</b> – greitis 0, todėl E_k = 0 ir E_p = E.</li>
  <li><b>3 taškas</b> – žemiausias (h = 0), todėl E_p = 0 ir E_k = E.</li>
  <li><b>5 taškas</b> – tas pats aukštis kaip 1 taško, todėl E_p = E, E_k = 0 (kamuoliukas sustoja).</li>
  <li><b>Tarpiniai taškai (2, 4)</b> – jei žinoma viena energija, kitą randame: E_k = E − E_p arba E_p = E − E_k.</li>
</ol>

<h3>Pavyzdys (E = 100 J)</h3>
<table class="data-table">
  <tr><th>Taškas</th><th>E_p</th><th>E_k</th><th>E</th></tr>
  <tr><td>1</td><td>100 J</td><td>0</td><td>100 J (duota)</td></tr>
  <tr><td>2</td><td>100 − 20 = 80 J</td><td>20 J (duota)</td><td>100 J</td></tr>
  <tr><td>3</td><td>0</td><td>100 J</td><td>100 J</td></tr>
  <tr><td>4</td><td>30 J (duota)</td><td>100 − 30 = 70 J</td><td>100 J</td></tr>
  <tr><td>5</td><td>100 J</td><td>0</td><td>100 J</td></tr>
</table>
<div class="figure">${FIGS.energyBars}<div class="fig-caption">Mėlyna – potencinė, oranžinė – kinetinė energija. Jų suma (žalia linija) visuose taškuose vienoda.</div></div>

<div class="callout info"><span class="ico">🧠</span><div><span class="co-title">Kaip paaiškinti, kaip kinta energija riedant aukštyn (nuo 3 iki 5 taško)?</span><p>Kamuoliukui riedant aukštyn, aukštis didėja – todėl <b>potencinė energija didėja</b>. Greitis mažėja – todėl <b>kinetinė energija mažėja</b>. Pilnutinė energija <b>nekinta</b>, nes trinties nėra ir pagal energijos tvermės dėsnį kinetinė energija tik virsta potencine.</p></div></div>

<details class="reveal"><summary>Pasitikrink: 1 taške E = 160 J. Kokia energija 3 taške?</summary><div><p>3 taškas žemiausias: E_p = 0, E_k = 160 J, E = 160 J.</p></div></details>
<details class="reveal"><summary>Pasitikrink: 1 taške E = 10 J, o 4 taške E_p = 2 J. Kokia E_k 4 taške?</summary><div><p>E_k = E − E_p = 10 − 2 = <b>8 J</b>, E = 10 J.</p></div></details>
<details class="reveal"><summary>Ar galėtų kamuoliukas 5 taške pakilti aukščiau nei 1 taškas?</summary><div><p><b>Ne.</b> Pagal energijos tvermės dėsnį pilnutinė energija nepadidėja. Didžiausias aukštis, kurį jis gali pasiekti, – pradinis (kai visa energija vėl tampa potencine).</p></div></details>
`
},

/* ---------- 6. ORO PASIPRIEŠINIMAS ---------- */
{
id:'oro-pasipriesinimas',
title:'Energijos nuostoliai: oro pasipriešinimas',
html:`
<p>Realiai kūną veikia <b>oro pasipriešinimas</b> (ir trintis). Tada dalis mechaninės energijos virsta <b>šiluma</b> – pilnutinė mechaninė energija mažėja. Tokiuose uždaviniuose prašoma rasti, kiek energijos „prarasta“.</p>

<div class="formula-card" style="text-align:center"><h4>Energija oro pasipriešinimui nugalėti</h4><div class="formula">[[ E_nuost = E_pradž - E_pab ]]</div><p class="muted" style="margin:0;font-size:.9rem">Pradinė pilnutinė energija minus galinė pilnutinė energija.</p></div>

<h3>Tipas A: kūnas mestas stačiai aukštyn</h3>
<div class="card">
<p><b>Sąlyga.</b> 300 g akmuo mestas stačiai aukštyn 18 m/s greičiu ir pakilo į 15 m aukštį. (g ≈ 10 m/s²)</p>
<ol class="steps">
  <li><b>Išmetimo momentu:</b> E_k = m · v² / 2 = 0,3 · 18² / 2 = 0,3 · 324 / 2 = <b>48,6 J</b>; E_p = 0 (išmestas nuo žemės).</li>
  <li><b>Aukščiausiame taške:</b> v = 0, todėl E_k = 0; E_p = m · g · h = 0,3 · 10 · 15 = <b>45 J</b>.</li>
  <li><b>Oro pasipriešinimui:</b> 48,6 − 45 = <b>3,6 J</b>.</li>
</ol>
</div>

<h3>Tipas B: kūnas mestas žemyn iš aukščio</h3>
<div class="card">
<p><b>Sąlyga.</b> 50 g kamuoliukas iš 10 m aukščio mestas 8 m/s greičiu žemyn. Ant žemės jis nukrito 14 m/s greičiu.</p>
<ol class="steps">
  <li><b>Išmetimo momentu:</b> E_k = 0,05 · 8² / 2 = 0,05 · 64 / 2 = <b>1,6 J</b>; E_p = 0,05 · 10 · 10 = <b>5 J</b>. Pilnutinė E = 6,6 J.</li>
  <li><b>Prieš pasiekiant žemę:</b> E_p = 0; E_k = 0,05 · 14² / 2 = 0,05 · 196 / 2 = <b>4,9 J</b>.</li>
  <li><b>Oro pasipriešinimui:</b> 6,6 − 4,9 = <b>1,7 J</b>.</li>
</ol>
</div>

<div class="callout warn"><span class="ico">⚠️</span><div><span class="co-title">Nepamiršk</span><p>Jei kūnas išmestas iš aukščio <b>ir</b> su greičiu, pradžioje jis turi <b>abi</b> energijas – reikia jas sudėti. Jei nepaisoma oro pasipriešinimo – nuostolių nėra ir E pradžioje = E pabaigoje.</p></div></div>

<details class="reveal"><summary>Pasitikrink: 200 g kamuoliukas mestas stačiai aukštyn 15 m/s greičiu pakilo į 10 m. Kiek energijos sunaudota oro pasipriešinimui?</summary><div>
<ol class="steps"><li>E_k pradžioje = 0,2 · 225 / 2 = 22,5 J.</li><li>E_p viršuje = 0,2 · 10 · 10 = 20 J.</li><li>Nuostoliai: 22,5 − 20 = <b>2,5 J</b>.</li></ol>
</div></details>
`
},

/* ---------- 7. FORMULĖS IR SĄVOKOS ---------- */
{
id:'formules-savokos',
title:'Svarbiausios formulės, sąvokos ir vienetai',
html:`
<h3>Formulių lapelis</h3>
<div class="formula-grid">
  <div class="formula-card"><h4>Mechaninis darbas</h4><div class="formula">[[ A = F * s ]]</div></div>
  <div class="formula-card"><h4>Darbas, kai jėga veikia kampu</h4><div class="formula">[[ A = F * s * cos alpha ]]</div></div>
  <div class="formula-card"><h4>Galia</h4><div class="formula">[[ N = A / t ]]</div></div>
  <div class="formula-card"><h4>Sunkio jėga</h4><div class="formula">[[ F = m * g ]]</div></div>
  <div class="formula-card"><h4>Potencinė energija</h4><div class="formula">[[ E_p = m * g * h ]]</div></div>
  <div class="formula-card"><h4>Kinetinė energija</h4><div class="formula">[[ E_k = m * v^2 / 2 ]]</div></div>
  <div class="formula-card"><h4>Pilnutinė energija</h4><div class="formula">[[ E = E_p + E_k ]]</div></div>
  <div class="formula-card"><h4>Greitis iš kinetinės energijos</h4><div class="formula">[[ v = sqrt(2 * E_k / m) ]]</div></div>
  <div class="formula-card"><h4>Greitis nukritus iš aukščio h</h4><div class="formula">[[ v = sqrt(2 * g * h) ]]</div></div>
  <div class="formula-card"><h4>Pakilimo aukštis</h4><div class="formula">[[ h = v^2 / (2 * g) ]]</div></div>
  <div class="formula-card"><h4>Masė iš tūrio ir tankio</h4><div class="formula">[[ m = rho * V ]]</div></div>
  <div class="formula-card"><h4>Energijos tvermės dėsnis</h4><div class="formula" style="font-size:1rem">Uždaroje sistemoje pilnutinė mechaninė energija nekinta.</div></div>
</div>

<h3>Dydžiai, žymėjimai ir vienetai</h3>
<table class="data-table">
  <tr><th>Dydis</th><th>Raidė</th><th>Pagrindinis vienetas</th></tr>
  <tr><td>Mechaninis darbas</td><td>A</td><td>džaulis (J)</td></tr>
  <tr><td>Galia</td><td>N</td><td>vatas (W)</td></tr>
  <tr><td>Mechaninė energija</td><td>E</td><td>džaulis (J)</td></tr>
  <tr><td>Jėga</td><td>F</td><td>niutonas (N)</td></tr>
  <tr><td>Aukštis</td><td>h</td><td>metras (m)</td></tr>
  <tr><td>Poslinkis</td><td>s</td><td>metras (m)</td></tr>
  <tr><td>Laikas</td><td>t</td><td>sekundė (s)</td></tr>
  <tr><td>Greitis</td><td>v</td><td>m/s</td></tr>
  <tr><td>Masė</td><td>m</td><td>kilogramas (kg)</td></tr>
  <tr><td>Laisvojo kritimo pagreitis</td><td>g</td><td>m/s² (g ≈ 10 m/s²)</td></tr>
</table>

<h3>Vienetų perskaičiavimas</h3>
<div class="grid-2">

{
id:'pavyzdziai',
title:'Uždavinių sprendimo pavyzdžiai',
html:`
<p>Pavyzdžiai paruošti pagal kontrolinio ir kartojimo užduočių tipus. Pirma pabandyk išspręsti pats, tada pasitikrink. Visur g ≈ 10 m/s².</p>

<h3>1 pavyzdys. Darbas ir galia keliant kibirą</h3>
<div class="card">
<p><b>Sąlyga.</b> Ūkininkas per 1 minutę iš 8 m gylio šulinio iškėlė 120 N svorio kibirą. Kokį darbą jis atliko? Kokia buvo jo galia?</p>
<ol class="steps">
  <li>A = F · s = 120 N · 8 m = <b>960 J</b>.</li>
  <li>t = 1 min = 60 s; N = A / t = 960 / 60 = <b>16 W</b>.</li>
</ol>
</div>

<h3>2 pavyzdys. Lifto variklio darbas ir galia</h3>
<div class="card">
<p><b>Sąlyga.</b> Liftas per 15 s pakilo į 9 m aukštį. Kėlimo metu lifto variklio jėga buvo 5000 N. Kokį darbą atliko variklis? Kokia jo galia?</p>
<ol class="steps">
  <li>A = F · s = 5000 N · 9 m = <b>45 000 J</b> = 45 kJ.</li>
  <li>N = A / t = 45 000 / 15 = <b>3000 W</b> = 3 kW.</li>
</ol>
</div>

<h3>3 pavyzdys. Į kokį aukštį liftas pakels krovinį?</h3>
<div class="card">
<p><b>Sąlyga.</b> Lifto variklio galia 50 kW. Į kokį aukštį jis gali pakelti 250 kg krovinį per 4 s?</p>
<ol class="steps">
  <li>N = 50 kW = 50 000 W; A = N · t = 50 000 · 4 = 200 000 J.</li>
  <li>A = m · g · h, todėl h = A / (m · g) = 200 000 / (250 · 10) = <b>80 m</b>.</li>
</ol>
</div>

<h3>4 pavyzdys. Kruonio HAE</h3>
<div class="card">
<p><b>Sąlyga.</b> Kruonio HAE viršutinis baseinas yra 137 m aukščiau Kauno marių. Per sekundę vamzdžiu pakeliama 200 m³ vandens (ρ = 1000 kg/m³). Koks atliktas darbas ir kokia variklio galia?</p>
<ol class="steps">
  <li>Masė: m = ρ · V = 1000 · 200 = 200 000 kg.</li>
  <li>Sunkio jėga: F = m · g = 200 000 · 10 = 2 000 000 N.</li>
  <li>Darbas: A = F · s = 2 000 000 · 137 = <b>274 000 000 J = 274 MJ</b>.</li>
  <li>Galia (t = 1 s): N = A / t = <b>274 000 000 W = 274 MW</b>.</li>
</ol>
</div>

<h3>5 pavyzdys. Laikas iš darbo ir galios</h3>
<div class="card">
<p><b>Sąlyga.</b> Variklio galia 70 kW. Per kiek laiko jis atliks 147 MJ darbą?</p>
<ol class="steps">
  <li>N = 70 000 W; A = 147 000 000 J.</li>
  <li>t = A / N = 147 000 000 / 70 000 = <b>2100 s = 35 min</b>.</li>
</ol>
</div>

<h3>6 pavyzdys. Krentantis kamuoliukas</h3>
<div class="card">
<p><b>Sąlyga.</b> 200 g kamuoliukas paleidžiamas kristi iš 5 m aukščio. Raskite jo energijas viršuje, 2,5 m aukštyje ir prie žemės bei greitį prie žemės.</p>
<ol class="steps">
  <li>Viršuje: E_p = 0,2 · 10 · 5 = 10 J; E_k = 0; E = 10 J.</li>
  <li>2,5 m aukštyje: E_p = 0,2 · 10 · 2,5 = 5 J; E_k = 10 − 5 = 5 J.</li>
  <li>Prie žemės: E_p = 0; E_k = 10 J.</li>
  <li>Greitis: [[ v = sqrt(2 * E_k / m) = sqrt(2 * 10 / 0,2) = sqrt(100) ]] = <b>10 m/s</b>.</li>
</ol>
</div>

<h3>7 pavyzdys. Strėlė šaunama aukštyn</h3>
<div class="card">
<p><b>Sąlyga.</b> Strėlė paleidžiama 30 m/s greičiu stačiai į viršų. Į kokį aukštį ji pakils, jei nepaisysime oro pasipriešinimo?</p>
<ol class="steps">
  <li>Apačioje visa energija kinetinė, viršuje – potencinė: [[ m * v^2 / 2 = m * g * h ]].</li>
  <li>Masė susiprastina: [[ h = v^2 / (2 * g) = 30^2 / (2 * 10) = 900 / 20 ]] = <b>45 m</b>.</li>
</ol>
</div>

<h3>8 pavyzdys. Šuolis į vandenį</h3>
<div class="card">
<p><b>Sąlyga.</b> Šuolininkas šoka į vandenį nuo 7,2 m aukščio bokšto. Kokiu greičiu jis paners į vandenį, jei nepaisysime oro pasipriešinimo?</p>
<ol class="steps">
  <li>[[ v = sqrt(2 * g * h) = sqrt(2 * 10 * 7,2) = sqrt(144) ]] = <b>12 m/s</b>.</li>
</ol>
</div>

<h3>9 pavyzdys. Kūnas su pradiniu greičiu</h3>
<div class="card">
<p><b>Sąlyga.</b> Kūnas iš 10 m aukščio mestas žemyn 18 km/h greičiu. Kokiu greičiu jis pasieks žemę (be oro pasipriešinimo)?</p>
<ol class="steps">
  <li>v₀ = 18 km/h = 18 : 3,6 = 5 m/s.</li>
  <li>Pradžioje: [[ E = m * g * h + m * v_0^2 / 2 ]]; pabaigoje: [[ E = m * v^2 / 2 ]]. Masė susiprastina.</li>
  <li>[[ v^2 = v_0^2 + 2 * g * h = 25 + 200 = 225 ]] → v = <b>15 m/s</b>.</li>
</ol>
</div>

<h3>10 pavyzdys. Energijos nuostoliai</h3>
<div class="card">
<p><b>Sąlyga.</b> 100 g kamuoliukas iš 15 m aukščio mestas 6 m/s greičiu žemyn. Ant žemės jis nukrito 16 m/s greičiu. Kiek energijos sunaudota oro pasipriešinimui nugalėti?</p>
<ol class="steps">
  <li>Pradžioje: E_k = 0,1 · 36 / 2 = 1,8 J; E_p = 0,1 · 10 · 15 = 15 J; E = 16,8 J.</li>
  <li>Pabaigoje: E_k = 0,1 · 256 / 2 = 12,8 J; E_p = 0.</li>
  <li>Nuostoliai: 16,8 − 12,8 = <b>4 J</b>.</li>
</ol>
</div>
`

{

title:'Įvadas: kodėl prasidėjo Nepriklausomybės karas?',
html:`
<p>1918 m. vasario 16 d. Lietuvos Taryba paskelbė <b>Lietuvos nepriklausomybės aktą</b> – tačiau naujoji valstybė tuomet dar egzistavo tik popieriuje. Kaip ir visa Rytų Europa, Lietuva buvo Vokietijos okupuota, neturėjo nei kariuomenės, nei biudžeto, nei administracijos. Įsibėgėjus Pirmojo pasaulinio karo pabaigai prasidėjo <b>Nepriklausomybės karas (1918–1920 m.)</b> – kovos už tai, kad valstybė tikrai atsirastų žemėlapyje.</p>

<div class="callout info"><span class="ico">📌</span><div><span class="co-title">Apibrėžimas</span><p><b>Lietuvos nepriklausomybės karas (1918–1920 m.)</b> – Lietuvos valstybės kovos su trimis priešais: <b>bolševikais</b> (bolševikinė Rusija), <b>bermontininkais</b> ir <b>lenkais</b>, kurių metu buvo apginta jaunos valstybės nepriklausomybė.</p></div></div>

<h3>Kodėl karas prasidėjo būtent tada?</h3>
<ol class="steps">
  <li><b>1918 m. lapkričio 11 d. Compiègne'o (Komjeno) paliaubos</b> – Pirmasis pasaulinis karas baigiasi Vokietijos pralaimėjimu.</li>
  <li>Pagal paliaubas <b>Vokietijos kariuomenė traukiasi iš užimtų teritorijų</b> – Lietuvoje susidaro „tuštuma“, kurią užpildyti nori visos aplinkinės jėgos.</li>
  <li>Rusijoje po 1917 m. bolševikų perversmo paskelbta <b>pasaulinės revoliucijos</b> idėja – bolševikai veržiasi į vakarus.</li>
  <li>Atgimusi <b>Lenkija</b> siekia prijungti buvusias Lietuvos Didžiosios Kunigaikštystės žemes, tarp jų – Vilnių.</li>
</ol>

<h3>Trys priešai – trys kryptys</h3>
<div class="grid-3">
  <div class="mini-card"><div class="big-ico">🔴</div><h4>Bolševikai</h4><p>Rusijos raudonoji armija, siekusi Pabaltijyje įkurti tarybų valdžią. Įsiveržė 1918 m. gruodžio pabaigoje.</p></div>
  <div class="mini-card"><div class="big-ico">⚔️</div><h4>Bermontininkai</h4><p>Rusų ir vokiečių karių likučiai, 1919 m. rudenį užėmę šiaurės vakarų Lietuvą.</p></div>
  <div class="mini-card"><div class="big-ico">🦅</div><h4>Lenkai</h4><p>Lenkijos kariuomenė, siekusi prijungti Lietuvos žemes; kovos dėl Vilniaus krašto tęsėsi iki 1920 m. pabaigos.</p></div>
</div>

<div class="callout warn"><span class="ico">⚠️</span><div><span class="co-title">Sunkiausia sąlyga</span><p>Neturėdama patirties, kariuomenės, karo priemonių bei finansų, Lietuva turėjo kovoti su keliais priešais iš karto. Būtent todėl šios kovos ir vadinamos Nepriklausomybės karu, o ne „vienu mūšiu“.</p></div></div>

<h3>Kas padėjo laimėti?</h3>
<div class="grid-2">
  <div class="mini-card"><h4>🪖 Savanorių motyvacija</h4><p>Į kariuomenę ėjo žmonės, kuriems nepriklausomybė buvo asmeninis reikalas – jie kovojo už savo kraštą.</p></div>
  <div class="mini-card"><h4>🤝 Diplomatija</h4><p>Valstybės vadovai kartu su kariuomene kovojo ir derybų stalais: ieškota užsienio pripažinimo ir paramos.</p></div>
  <div class="mini-card"><h4>🇩🇪 Vokietijos veiksnys</h4><p>1919 m. pradžioje bolševikų puolimą padėjo stabdyti ir traukiantys vokiečių daliniai – jie dar laikė dalį pozicijų.</p></div>
  <div class="mini-card"><h4>🌍 Tarptautinė situacija</h4><p>Pralaimėjusi Vokietija ir susilpnėjusi Rusija negalėjo sutelkti visų jėgų vien prieš Lietuvą.</p></div>
</div>

title:'Tarpukario Europa: demokratija ir diktatūros',
html:`
<p>Po Pirmojo pasaulinio karo Europoje atsirado daug naujų valstybių: Lietuva, Latvija, Estija, Lenkija, Suomija, Čekoslovakija ir kitos. Pasaulyje vyravo <b>demokratijos banga</b> – buvo tikimasi, kad tautos pačios tvarkys savo gyvenimą. Tačiau tarpukario laikotarpiu (1918–1939 m.) <b>daugelyje valstybių demokratija nesusitvirtino</b> ir įsivyravo diktatūros: autoritarinės arba totalitarinės.</p>

<h3>Autoritarinė ir totalitarinė santvarka</h3>
<table class="data-table">
  <tr><th>Požymis</th><th>Autoritarinė valdžia</th><th>Totalitarinė valdžia</th></tr>
  <tr><td>Kas valdo?</td><td>vienas asmuo arba nedidelė žmonių grupė</td><td>vienas lyderis arba partija, kuriai priklauso visa valdžia</td></tr>
  <tr><td>Rinkimai</td><td>nėra sąžiningų rinkimų</td><td>rinkimų apskritai nėra (arba jie – tik formalumas)</td></tr>
  <tr><td>Žmogaus teisės</td><td>pažeidžiamos ir kontroliuojamos</td><td>visiškai panaikinamos</td></tr>
  <tr><td>Persekiojimas</td><td>nėra <b>masinio teroro</b></td><td><b>masinis teroras</b>: bausmės be teismo, priešininkų naikinimas</td></tr>
  <tr><td>Kontroliuojamos sritys</td><td>daugiausia politika ir valdžia</td><td><b>absoliučiai visos</b>: ekonomika, švietimas, žiniasklaida, net asmeninis žmonių gyvenimas</td></tr>
</table>

<div class="callout warn"><span class="ico">⚠️</span><div><span class="co-title">Svarbus skirtumas</span><p>Autoritarinėje santvarkoje valdžia kontroliuoja <b>valstybę</b>, o totalitarinėje – <b>visą žmogaus gyvenimą</b>. Todėl „totalitarinis" yra griežtesnis, sunkesnis režimas.</p></div></div>

<h3>Kodėl kai kuriose šalyse įsigalėjo diktatūra?</h3>
<div class="grid-2">
  <div class="mini-card"><h4>🏛️ Demokratija buvo per silpna</h4><p>Naujosiose valstybėse <b>trūko demokratijos patirties</b> – žmonės nebuvo įpratę prie laisvų rinkimų, parlamentų, partijų.</p></div>
  <div class="mini-card"><h4>💥 Karo nusivylimas</h4><p>Po Pirmojo pasaulinio karo žmonės buvo pavargę, nusivylę, bijojo naujų karų ir revoliucijų.</p></div>
  <div class="mini-card"><h4>📉 Ekonominės krizės</h4><p>Nedarbas, skurdas, infliacija skatino ieškoti „stiprios rankos", kuri viską sutvarkys.</p></div>
  <div class="mini-card"><h4>👑 Stipraus lyderio ilgesys</h4><p>Dalis visuomenės tikėjo, kad vienas griežtas valdovas valstybę padarys stiprią ir tvarkingą.</p></div>
</div>

<h3>Valstybių pavyzdžiai</h3>
<div class="grid-3">
  <div class="mini-card"><h4>🚩 Tarybų Sąjunga (SSRS)</h4><p>Valdžia – komunistų partija, ideologija – <b>komunizmas</b>. Totalitarinė santvarka: valstybei priklauso ekonomika, draudžiama kitokia nuomonė.</p></div>
  <div class="mini-card"><h4>🏴 Vokietija</h4><p>Nuo 1933 m. valdžią paėmęs A. Hitleris įtvirtino <b>nacizmą / fašizmą</b> – totalitarinę santvarką su masiniu teroru.</p></div>
  <div class="mini-card"><h4>🇮🇹 Italija</h4><p>Nuo 1922 m. valdė <b>fašistai</b>, vadovaujami B. Mussolini – totalitarinė santvarka.</p></div>
</div>

<div class="callout info"><span class="ico">🌍</span><div><span class="co-title">Diktatūros plito ir kitur</span><p>Autoritariniai režimai tarpukariu įsigalėjo ir daugelyje kitų šalių: <b>Vengrijoje</b> (M. Horthy, 1920 m.), <b>Ispanijoje</b> (M. Primo de Rivera, 1923 m.), <b>Portugalijoje</b> (A. Salazaras, 1932 m.), <b>Lenkijoje</b> (J. Piłsudskio režimas nuo 1926 m.), o vėliau ir <b>Lietuvoje</b> (A. Smetonos autoritarinis režimas nuo 1926 m.).</p></div></div>

<details class="reveal"><summary>Pasitikrink: kuo totalitarinė santvarka griežtesnė už autoritarinę?</summary><div><p>Totalitarinė santvarka kontroliuoja <b>visas</b> gyvenimo sritis (ekonomiką, švietimą, žiniasklaidą, asmeninį gyvenimą) ir naudoja masinį terorą, o autoritarinė daugiausia kontroliuoja politiką ir valdžią, be masinio teroro.</p></div></details>

<details class="reveal"><summary>Pasitikrink: kodėl demokratija tarpukario Europoje ne visur prigijo?</summary><div><p>Nes daugelis valstybių buvo jaunos ir <b>neturėjo demokratijos patirties</b>; visuomenė buvo nusivylusi karu ir patyrusi ekonomines krizes, todėl žmonės tikėjo „stipria ranka" – taip į valdžią atėjo diktatoriai.</p></div></details>

<details class="reveal"><summary>Pasitikrink: kurios trys valstybės – totalitarinių santvarkų pavyzdžiai?</summary><div><p><b>Tarybų Sąjunga</b> (komunizmas), <b>Vokietija</b> (nacizmas/fašizmas) ir <b>Italija</b> (fašizmas).</p></div></details>
`
},

/* ---------- 3. VALSTYBĖS KŪRIMASIS ---------- */
{
id:'valstybes-kurimas',
title:'Lietuvos valstybingumo kūrimasis (1918 m.)',
html:`
<p>Nepriklausomybės aktas buvo tik pradžia: reikėjo sukurti visas valstybės institucijas – vyriausybę, ministerijas, kariuomenę, pinigus, tad kiekviena savaitė 1918 m. pabaigoje turėjo milžinišką reikšmę.</p>

<h3>Pagrindinės datos</h3>
<ol class="steps">
  <li><b>1918 m. vasario 16 d.</b> – Lietuvos Taryba (20 narių, jai vadovavo <b>Jonas Basanavičius</b>) paskelbia <b>Lietuvos Nepriklausomybės aktą</b>: atkuriama nepriklausoma, demokratiniais principais grindžiama Lietuvos valstybė.</li>
  <li><b>1918 m. lapkričio 11 d.</b> – sudaroma pirmoji Lietuvos vyriausybė, kuriai vadovauja <b>Augustinas Voldemaras</b>; pradedama kurti valstybės aparatą.</li>
  <li><b>1918 m. lapkričio 23 d.</b> – priimamas <b>savanorių įstatymas</b>, kviečiantis žmones savo noru stoti į Lietuvos kariuomenę.</li>
  <li><b>1918 m. gruodžio 27 d.</b> – <b>Mykolo Šleževičiaus vyriausybės atsišaukimas</b>, kuriuo visi kviečiami ginti tėvynę nuo bolševikų.</li>
</ol>

<div class="callout info"><span class="ico">🏛️</span><div><span class="co-title">Kas buvo kas?</span><p><b>Lietuvos Taryba</b> – laikinas aukščiausios valdžios organas (jam vadovavo J. Basanavičius). <b>A. Smetona</b> nuo 1919 m. tapo pirmuoju šalies prezidentu, o <b>A. Voldemaras</b> – pirmosios vyriausybės vadovu.</p></div></div>

<h3>Pagalba Vakaruose: diplomatinė kova</h3>
<p>1918 m. pabaigoje <b>A. Smetona ir A. Voldemaras išvyko į Vakarus ieškoti pagalbos</b>. Smetona vyko į Prancūziją – į <b>Versalį, kur vyko Paryžiaus taikos konferencija</b>, kad Lietuva būtų pripažinta diplomatiškai. Deja, <b>Prancūzija iš pradžių nieko nedavė, nes rėmė Lenkiją</b>: sąjungininkai tikėjosi, kad didelė Lenkija bus barjeras prieš bolševikų revoliuciją.</p>

<div class="callout warn"><span class="ico">⚠️</span><div><span class="co-title">Kodėl pripažinimas taip svarbus?</span><p>Valstybė, kurios <b>niekas nepripažįsta</b>, negali pasirašinėti tarptautinių sutarčių, gauti paskolų, prekiauti kaip lygi partnerė. Todėl paraleliai su kovomis kariavo ir diplomatija.</p></div></div>

<h3>Kodėl tai buvo itin sunku?</h3>
<div class="grid-2">
  <div class="mini-card"><h4>❌ Nėra kariuomenės</h4><p>1918 m. rudenį Lietuva faktiškai neturėjo savo kariuomenės – ją teko kurti nuo nulio, dalimis remiantis savanoriais.</p></div>
  <div class="mini-card"><h4>❌ Nėra finansų ir administracijos</h4><p>Nebuvo biudžeto, pinigų, mokesčių sistemos; valdžios aparatas tik kūrėsi iš kelių dešimčių žmonių.</p></div>
  <div class="mini-card"><h4>❌ Okupuota teritorija</h4><p>Šalį vis dar kontroliavo Vokietijos kariuomenė, o tuoj pat pradėjo pulti ir bolševikai.</p></div>
  <div class="mini-card"><h4>✅ Vis dėlto pavyko</h4><p>Savanorių atsišaukimas veikė: 1919 m. pradžioje į kariuomenę jau rinkosi tūkstančiai žmonių – moksleivių, valstiečių, darbininkų.</p></div>
</div>

<details class="reveal"><summary>Pasitikrink: ką ir kada paskelbė Lietuvos Taryba?</summary><div><p><b>1918 m. vasario 16 d.</b> buvo paskelbtas Lietuvos Nepriklausomybės aktas, skelbiantis atkuriamą nepriklausomą valstybę. Tarybai vadovavo Jonas Basanavičius.</p></div></details>

<details class="reveal"><summary>Pasitikrink: kodėl Smetona ir Voldemaras išvyko į Vakarus? Kodėl Prancūzija padėti neskubėjo?</summary><div><p>Jie siekė, kad Lietuva būtų <b>diplomatiškai pripažinta</b> Paryžiaus taikos konferencijoje. Prancūzija iš pradžių nieko nedavė, nes <b>rėmė Lenkiją</b> – sąjungininkai Lenkiją laikė svarbiausia jėga prieš bolševikus.</p></div></details>

<details class="reveal"><summary>Pasitikrink: ką kvietė daryti 1918 m. gruodžio 27 d. atsišaukimas?</summary><div><p>M. Šleževičiaus vyriausybės atsišaukimas kvietė <b>savanorius stoti į kariuomenę ir ginti tėvynę</b> nuo bolševikų. Jis buvo vykdomas pagal 1918 m. lapkričio 23 d. priimtą savanorių įstatymą.</p></div></details>
`
}

<h3>Prielaidos</h3>
<ul>
  <li><b>1918 m. lapkričio 11 d. Compiègne'o (Komjeno) paliaubos</b> – Vokietijos kariuomenė pradeda trauktis iš užimtų teritorijų.</li>
  <li><b>1918 m. gruodžio pabaigoje bolševikų kariuomenė įsiveržia į Lietuvos teritoriją.</b></li>
  <li>Traukiantis vokiečiams, frontas faktiškai išnyko – kelią į šalį atvėrė „tuštuma“.</li>
</ul>

<h3>Bolševikų tikslai</h3>
<ol class="steps">
  <li>Įgyvendinti <b>pasaulinę revoliuciją</b> – paskleisti tarybų valdžią kuo plačiau.</li>

<p>Į Lietuvą įsiveržė „Raudonoji armija“ – sovietinės Rusijos kariuomenė.</p>

<h3>Karo eiga</h3>
<ol class="steps">
  <li><b>1918 m. gruodžio 16 d.</b> – paskelbiama vadinamoji <b>Lietuvos Tarybų Respublika</b> (vadovauja Vincas Mickevičius-Kapsukas).</li>
  <li><b>1918 m. pabaiga – 1919 m. vasaris:</b> bolševikai užima šiaurinę ir rytinę Lietuvos dalį, 1919 m. sausį – Vilnių.</li>
  <li><b>1918 m. gruodžio 27 d.</b> – M. Šleževičiaus vyriausybės atsišaukimas savanoriams; pradedama kurti kariuomenė Kaune.</li>
  <li><b>1919 m. vasario mėn.:</b> vokiečių daliniai ir besikurianti Lietuvos kariuomenė <b>sulaiko bolševikų puolimą prie Kėdainių ir Alytaus</b>. Šiuose mūšiuose žūsta pirmieji: <b>P. Lukšys</b> (prie Kėdainių) ir <b>A. Juozapavičius</b> (prie Alytaus).</li>
  <li><b>1919 m. vasario 27 d.</b> – įkuriamas <b>Litbelas</b> – bendra Lietuvos ir Baltarusijos sovietinė respublika.</li>
  <li><b>1919 m. balandis–gegužė:</b> Lietuvos kariuomenė su savanoriais (ir vokiečių pagalba) <b>perima iniciatyvą</b>.</li>
  <li><b>1919 m. birželis–rugpjūtis:</b> bolševikai galutinai nugalimi ir <b>išstumiami</b> iš visos Lietuvos teritorijos (paskutinės kovos – Zarasų kryptimi).</li>

<h3>Kodėl bolševikų puolimas pavyko?</h3>
<div class="grid-2">
  <div class="mini-card"><h4>🔻 Jie turėjo jėgų</h4><p>Raudonoji armija buvo didelė, o Lietuva tuo metu neturėjo nei kariuomenės, nei ginklų – puolimas prasidėjo beveik nepasipriešinus.</p></div>
  <div class="mini-card"><h4>✅ Nors ir sunkiai, bet buvo sulaikyti</h4><p>Kai Kauno link prasidėjo rimtesnis veržimasis, savanorių pajėgos augo, o prie Kėdainių ir Alytaus puolimas buvo sulaikytas.</p></div>
</div>

<details class="reveal"><summary>Pasitikrink: kada ir kodėl bolševikai įsiveržė į Lietuvą?</summary><div><p><b>1918 m. gruodžio pabaigoje</b>, pasirašius Compiègne'o paliaubas ir pradėjus trauktis Vokietijos kariuomenei. Jie siekė pasaulinės revoliucijos ir tarybų valdžios Pabaltijyje.</p></div></details>

<details class="reveal"><summary>Pasitikrink: kas buvo Litbelas?</summary><div><p><b>Litbelas</b> (Lietuvos–Baltarusijos sovietinė respublika) – 1919 m. vasario 27 d. bolševikų įkurta bendra Lietuvos ir Baltarusijos „tarybų“ respublika, turėjusi pakeisti atskiras sovietines struktūras.</p></div></details>

<details class="reveal"><summary>Pasitikrink: kokia data laikoma bolševikų išstūmimo pabaiga?</summary><div><p><b>1919 m. rugpjūtis</b> (paskutinės kovos Zarasų kryptimi): tada raudonoji armija buvo visiškai išstumta iš Lietuvos teritorijos.</p></div></details>

html:`
<p><b>Bermontininkai</b> – rusų ir vokiečių karių likučiai, 1919 m. susibūrę į vadinamąją „Vakarų Rusijos savanorių armiją“, kurią vedė pulkininkas <b>Pavelas Bermontas-Avalovas</b> (nuo jo pavardės ir kilo „bermontininkų“ vardas). Iš pradžių jie veikė Kurše (Latvijoje), o 1919 m. rudenį ėmė pulti ir Lietuvą.</p>

<h3>Ką jie okupavo?</h3>
<p>Bermontininkai užėmė <b>šiaurės ir vakarų Lietuvos dalis</b>: Mažeikių, Šiaulių kraštą, priartėjo prie Radviliškio ir Raseinių. Jų tikslas buvo įsitvirtinti ir „atstovauti“ buvusiai Rusijos imperijai regione.</p>

<div class="callout info"><span class="ico">🗺️</span><div><span class="co-title">Žemėlapio ryšys</span><p>Žemėlapyje bermontininkų užimtų teritorijų <b>rytinė riba</b> pažymėta brūkšniuota linija, o jų puolimą atlaikę lietuvių mūšiai – kryželiu pažymėtose vietose. Sekcijoje „Žemėlapio nagrinėjimas“ viską pamatysi interaktyviai.</p></div></div>

<h3>Svarbiausi mūšiai ir vietovės</h3>
<ul>
  <li><b>Prie Raseinių</b> – bermontininkai bandė veržtis toliau į pietus; Lietuvos kariuomenė juos sulaikė.</li>
  <li><b>Prie Šiaulių</b> – miestas buvo okupuotas, vyko nuolatinės kovos dėl krašto kontrolės.</li>
  <li><b>Prie Radviliškio (lemiama pergalė)</b> – <b>1919 m. lapkričio 21–22 d.</b> įvykusios Radviliškio kautynės tapo lūžiu: Lietuvos kariuomenė sumušė bermontininkus, atkirto juos nuo Šiaulių ir privertė trauktis.</li>
</ul>

<h3>Kaip vyko Radviliškio kautynės?</h3>
<ol class="steps">
  <li>Kautynės prasidėjo <b>1919 m. lapkričio 21 d. 3 val. ryto</b>.</li>
  <li>Lietuvių dalys smogė bermontininkams ir po atkaklių kovų <b>užėmė Radviliškį</b>.</li>
  <li>Buvo nutrauktas susisiekimas tarp Šiaulių ir Raseinių: bermontininkai atkirsti šiaurėje (ties Meškuičiais) ir pietuose (ties Bazilionais).</li>
  <li>Po tokio smūgio bermontininkai nebeatsigavo – jie traukėsi į Latviją ir Rytprūsius.</li>
</ol>

<div class="callout success"><span class="ico">🏆</span><div><span class="co-title">Kodėl tai lemiama pergalė?</span><p>Po Radviliškio mūšio lietuviai perėmė iniciatyvą visame fronte: buvo išlaisvinti Šiauliai, ir iki 1919 m. gruodžio bermontininkai buvo išvaryti iš Lietuvos teritorijos. Be to, kautynėse paimta daug ginklų ir amunicijos – tai sustiprino besikuriančią Lietuvos kariuomenę.</p></div></div>

<h3>Kodėl Lietuva laimėjo?</h3>
<div class="grid-2">
  <div class="mini-card"><h4>🎯 Dėl savanorių motyvacijos</h4><p>Lietuviai kovojo už savo kraštą, o bermontininkai buvo samdiniai likučiai, neturėję aiškaus tikslo.</p></div>
  <div class="mini-card"><h4>⚙️ Dėl visuomenės palaikymo</h4><p>Vietiniai gyventojai padėjo kariuomenei: rinko žvalgybos informaciją, slėpė karius, rėmė maistu.</p></div>
</div>

<details class="reveal"><summary>Pasitikrink: kas buvo bermontininkai?</summary><div><p>Rusų ir vokiečių karių likučiai, susibūrę į „Vakarų Rusijos savanorių armiją“ ir 1919 m. rudenį užėmę šiaurės vakarų Lietuvą. Vadovas – P. Bermontas-Avalovas.</p></div></details>

<details class="reveal"><summary>Pasitikrink: kodėl Radviliškio mūšis vadinamas lemiamu?</summary><div><p>Nes jame lietuviai galutinai sumušė bermontininkų pajėgas ir perėmė iniciatyvą: bermontininkai buvo atkirsti nuo Šiaulių ir iki 1919 m. gruodžio išvaryti iš Lietuvos.</p></div></details>

<details class="reveal"><summary>Pasitikrink: kur vyko mūšiai su bermontininkais? (3 vietos)</summary><div><p><b>Raseiniai, Radviliškis, Šiauliai</b> (ir aplinkinės vietovės: Meškuičiai, Bazilionai).</p></div></details>
`
},

<h3>Kovų pradžia</h3>
<ul>
  <li>1919 m. pavasarį lenkų kariuomenė <b>užėmė Vilnių</b> (jį ginantiems vokiečiams traukiantis).</li>
  <li>1919 m. pabaigoje susidarė <b>Lietuvos ir Lenkijos kariuomenių fronto linija</b> – ji atskyrė lietuvių kontroliuojamą teritoriją nuo lenkų užimtos Vilniaus krašto dalies.</li>
  <li>Kovos vyko ir dėl Seinų krašto (pietų Lietuva).</li>

<h3>1920 m. liepos 12 d. Maskvos taikos sutartis</h3>
<p>Lemiamą diplomatinę pergalę Lietuva pasiekė pasirašydama taikos sutartį su Sovietų Rusija. Ją su Lietuva pasirašė <b>V. Leninas</b>. Svarbiausios sąlygos:</p>
<ol class="steps">
  <li>Sovietų Rusija <b>pripažino Lietuvos nepriklausomybę</b>.</li>
  <li>Pasižadėjo <b>atlyginti karo nuostolius</b>.</li>
  <li><b>Nustatyta rytinė siena</b>, pagal kurią Vilniaus kraštas ir Gardinas pripažinti Lietuvai.</li>
  <li>Abi šalys įsipareigojo <b>neleisti savo teritorija naudotis</b> šalims, kariaujančioms su kita puse.</li>
  <li>Rusija pasižadėjo <b>grąžinti karo metu pagrobtą turtą</b>.</li>
  <li>Lietuva buvo <b>atleista nuo valstybinių Rusijos skolų</b>.</li>
</ol>

<div class="callout success"><span class="ico">🤝</span><div><span class="co-title">Reikšmė</span><p>Tai <b>pirmoji valstybė, pripažinusi Lietuvą de jure</b> (teisiškai). Toks pripažinimas buvo labai svarbus kovoje su Lenkija dėl Vilniaus.</p></div></div>

<h3>Kodėl su Lenkija kariauti buvo sunkiausia?</h3>
<div class="grid-2">
  <div class="mini-card"><h4>😰 Lenkija – stipri sąjungininkė</h4><p>Lenkiją rėmė Vakarų valstybės (ypač Prancūzija), ji turėjo didelę ir gerai ginkluotą kariuomenę.</p></div>
  <div class="mini-card"><h4>⚔️ Tuo pat metu – ir bolševikai</h4><p>Lenkija kariavo su Sovietų Rusija, o tai kūrė abipusę „sandėrių“ situaciją, kurioje Lietuva manevravo tarp didžiųjų jėgų.</p></div>
</div>

<details class="reveal"><summary>Pasitikrink: įvardyk pagrindinę Lietuvos ir Lenkijos karo priežastį.</summary><div><p>Lenkijos siekis <b>prijungti Lietuvos žemes prie Lenkijos</b> (ypač Vilnių ir Vilniaus kraštą).</p></div></details>

<details class="reveal"><summary>Pasitikrink: išvardyk bent 4 Maskvos sutarties sąlygas.</summary><div><p>1) Pripažinta Lietuvos nepriklausomybė; 2) pažadėta atlyginti karo nuostolius; 3) nustatyta rytinė siena (Vilniaus kraštas ir Gardinas – Lietuvai); 4) šalys įsipareigojo neleisti savo teritorija naudotis kitiems karams; 5) grąžintas pagrobtas turtas; 6) Lietuva atleista nuo carinės Rusijos skolų.</p></div></details>

<details class="reveal"><summary>Pasitikrink: kodėl 1920 m. liepos 12 d. sutartis – diplomatinė pergalė?</summary><div><p>Nes Sovietų Rusija <b>pirmoji pripažino Lietuvą de jure</b> ir pripažino jai Vilniaus kraštą bei Gardiną – tai sutvirtino Lietuvos teises kovoje su Lenkija.</p></div></details>
`
}
,

/* ---------- 11. KLAUSIMAI APKLAUSAI ---------- */
{
id:'klausimai',
title:'Klausimai apklausai (be variantų)',
html:`
<div class="callout info" style="margin-top:0"><span class="ico">🗣️</span><div><span class="co-title">Kaip naudoti</span><p>Tai <b>ne testas</b> – variantų nėra. Atsakyk žodžiu arba raštu, tada atidaryk atsakymo pavyzdį ir palygink. Jei apklausoje gausi panašų klausimą – mokėsi atsakyti savais žodžiais.</p></div></div>

<h3>A. Europa ir diktatūros</h3>
<div class="hist-q"><p class="hq"><span class="hq-num">1.</span> Kuo skiriasi autoritarinė ir totalitarinė valdžia?</p>
<details class="reveal"><summary>Rodyti atsakymo pavyzdį</summary><div><p><b>Autoritarinėje</b> santvarkoje valdžia sutelkta vieno asmens ar grupės rankose, nėra sąžiningų rinkimų, žmonių teisės pažeidžiamos ir kontroliuojamos, tačiau nėra masinio teroro. <b>Totalitarinėje</b> – kontroliuojamos absoliučiai visos gyvenimo sritys (ekonomika, švietimas, asmeninis gyvenimas) ir naudojamas masinis teroras.</p></div></details></div>
<div class="hist-q"><p class="hq"><span class="hq-num">2.</span> Kodėl tarpukario Europoje kai kuriose šalyse įsigalėjo diktatūros? Pateik 2–3 pavyzdžius.</p>
<details class="reveal"><summary>Rodyti atsakymo pavyzdį</summary><div><p>Nes demokratija ten buvo <b>per silpna ir trūko patirties</b>, visuomenė nusivylusi karu, išgyveno ekonomines krizes, bijojo revoliucijų. Pavyzdžiai: <b>Italija</b> (fašistai, 1922), <b>Vokietija</b> (nacistai, 1933), <b>SSRS</b> (komunistai), taip pat Lenkija, Vengrija, vėliau Lietuva.</p></div></details></div>
<div class="hist-q"><p class="hq"><span class="hq-num">3.</span> Įvardyk tris totalitarines valstybes ir jų ideologijas.</p>
<details class="reveal"><summary>Rodyti atsakymo pavyzdį</summary><div><p><b>Tarybų Sąjunga</b> – komunizmas; <b>Vokietija</b> – nacizmas (fašizmas); <b>Italija</b> – fašizmas.</p></div></details></div>

<h3>B. Valstybingumo kūrimasis</h3>
<div class="hist-q"><p class="hq"><span class="hq-num">4.</span> Ką ir kada paskelbė Lietuvos Taryba? Kas jai vadovavo?</p>
<details class="reveal"><summary>Rodyti atsakymo pavyzdį</summary><div><p><b>1918 m. vasario 16 d.</b> paskelbtas Nepriklausomybės aktas. Tarybą (20 narių) sudarė ir jai vadovavo <b>Jonas Basanavičius</b>.</p></div></details></div>
<div class="hist-q"><p class="hq"><span class="hq-num">5.</span> Kada sudaryta pirmoji Lietuvos vyriausybė ir kas jai vadovavo?</p>
<details class="reveal"><summary>Rodyti atsakymo pavyzdį</summary><div><p><b>1918 m. lapkričio 11 d.</b>, vyriausybės vadovas – <b>Augustinas Voldemaras</b>.</p></div></details></div>
<div class="hist-q"><p class="hq"><span class="hq-num">6.</span> Kodėl A. Smetona ir A. Voldemaras vyko į Vakarus? Kodėl Prancūzija iš pradžių nepadėjo?</p>
<details class="reveal"><summary>Rodyti atsakymo pavyzdį</summary><div><p>Jie siekė <b>diplomatinio Lietuvos pripažinimo</b> (Smetona vyko į Prancūziją, į Versalį, kur vyko Paryžiaus taikos konferencija). Prancūzija paramos nedavė, nes <b>rėmė Lenkiją</b> – jai buvo svarbiau, kad prieš bolševikus stovėtų stipri Lenkija.</p></div></details></div>
<div class="hist-q"><p class="hq"><span class="hq-num">7.</span> Kokie du 1918 m. sprendimai padėjo kurti kariuomenę?</p>
<details class="reveal"><summary>Rodyti atsakymo pavyzdį</summary><div><p><b>1918 m. lapkričio 23 d.</b> savanorių įstatymas ir <b>1918 m. gruodžio 27 d.</b> M. Šleževičiaus vyriausybės atsišaukimas, kvietęs savanorius ginti tėvynę.</p></div></details></div>

<h3>C. Bolševikai</h3>
<div class="hist-q"><p class="hq"><span class="hq-num">8.</span> Kodėl bolševikai įsiveržė į Lietuvą ir ko jie siekė?</p>
<details class="reveal"><summary>Rodyti atsakymo pavyzdį</summary><div><p>Prielaidos: Compiègne'o paliaubos ir Vokietijos kariuomenės traukimasis („tuštuma“). Tikslai – <b>pasaulinė revoliucija</b>, tarybų valdžia Pabaltijo respublikose, Baltijos kraštų ir Lenkijos sugrąžinimas į bolševikinės Rusijos sudėtį.</p></div></details></div>
<div class="hist-q"><p class="hq"><span class="hq-num">9.</span> Kas buvo Litbelas?</p>
<details class="reveal"><summary>Rodyti atsakymo pavyzdį</summary><div><p><b>Litbelas</b> – 1919 m. vasario 27 d. įkurta bendra <b>Lietuvos ir Baltarusijos sovietinė respublika</b>, bolševikų bandymas sujungti okupuotų kraštų „tarybų“ valdžią.</p></div></details></div>
<div class="hist-q"><p class="hq"><span class="hq-num">10.</span> Kas žuvo prie Kėdainių ir kas – prie Alytaus? Kuo jie svarbūs?</p>
<details class="reveal"><summary>Rodyti atsakymo pavyzdį</summary><div><p>Prie Kėdainių žuvo <b>Povilas Lukšys</b> – pirmasis žuvęs savanoris; prie Alytaus – <b>Antanas Juozapavičius</b> – pirmasis žuvęs Lietuvos karininkas. Abiejose vietose 1919 m. vasario mėn. buvo sustabdytas bolševikų puolimas.</p></div></details></div>
<div class="hist-q"><p class="hq"><span class="hq-num">11.</span> Kada bolševikai buvo išstumti iš Lietuvos? Ką reiškia vardas „Kapsukas“?</p>
<details class="reveal"><summary>Rodyti atsakymo pavyzdį</summary><div><p>Iki <b>1919 m. rudens</b> (paskutinės kovos Zarasų kryptimi). „Kapsukas“ – tai ir žmogus (<b>V. Mickevičius-Kapsukas</b>, LTSR vadovas), ir sovietmečiu (1955–1989 m.) taip vadinta <b>Marijampolė</b>.</p></div></details></div>

<h3>D. Bermontininkai</h3>
<div class="hist-q"><p class="hq"><span class="hq-num">12.</span> Kas buvo bermontininkai ir kokia teritoriją jie buvo užėmę?</p>
<details class="reveal"><summary>Rodyti atsakymo pavyzdį</summary><div><p><b>Rusų ir vokiečių karių likučiai</b> („Vakarų Rusijos savanorių armija“, vadovas <b>P. Bermontas-Avalovas</b>), 1919 m. rudenį užėmę <b>šiaurės vakarų Lietuvą</b> (Šiaulius, Mažeikių kraštą, priartėję prie Radviliškio ir Raseinių).</p></div></details></div>
<div class="hist-q"><p class="hq"><span class="hq-num">13.</span> Įvardyk tris mūšių su bermontininkais vietas.</p>
<details class="reveal"><summary>Rodyti atsakymo pavyzdį</summary><div><p><b>Raseiniai, Radviliškis, Šiauliai.</b></p></div></details></div>
<div class="hist-q"><p class="hq"><span class="hq-num">14.</span> Kodėl Radviliškio kautynės vadinamos lemiama pergale?</p>
<details class="reveal"><summary>Rodyti atsakymo pavyzdį</summary><div><p>1919 m. lapkričio 21–22 d. lietuviai sumušė gausesnius bermontininkų dalinius, atkirto juos nuo Šiaulių ir privertė trauktis. Po šios pergalės iniciatyvą perėmė Lietuvos kariuomenė – iki 1919 m. gruodžio bermontininkai buvo išvaryti iš Lietuvos.</p></div></details></div>

<h3>E. Lenkai ir Vilniaus klausimas</h3>
<div class="hist-q"><p class="hq"><span class="hq-num">15.</span> Dėl ko kilo Lietuvos ir Lenkijos karas?</p>
<details class="reveal"><summary>Rodyti atsakymo pavyzdį</summary><div><p>Nes <b>Lenkija ketino prijungti Lietuvos žemes prie Lenkijos</b> (ypač svarbus buvo Vilniaus kraštas).</p></div></details></div>
<div class="hist-q"><p class="hq"><span class="hq-num">16.</span> Išvardyk bent keturias 1920 m. Maskvos taikos sutarties sąlygas.</p>
<details class="reveal"><summary>Rodyti atsakymo pavyzdį</summary><div><p>1) Sovietų Rusija pripažino Lietuvos nepriklausomybę; 2) pažadėjo atlyginti karo nuostolius; 3) nustatė rytinę sieną – Vilniaus kraštas ir Gardinas pripažinti Lietuvai; 4) šalys neleis savo teritorijos naudoti prieš kitą pusę kariaujančioms šalims; 5) Rusija grąžins pagrobtą turtą; 6) Lietuva atleista nuo Rusijos skolų.</p></div></details></div>
<div class="hist-q"><p class="hq"><span class="hq-num">17.</span> Kodėl L. Želigovskio veiksmai vadinami Suvalkų sutarties sulaužymu?</p>
<details class="reveal"><summary>Rodyti atsakymo pavyzdį</summary><div><p>1920 m. spalio 7 d. Suvalkų sutartimi Vilniaus kraštas priklausė Lietuvai, o jau <b>spalio 8 d.</b> Želigovskis imitavo tariamą „sukilimą“ (jį slapta rėmė POW organizacija) ir įsiveržė į Lietuvą, užimdamas Vilnių.</p></div></details></div>
<div class="hist-q"><p class="hq"><span class="hq-num">18.</span> Kaip baigėsi Širvintų–Giedraičių mūšis ir kodėl Vilnius vis tiek liko lenkų rankose?</p>
<details class="reveal"><summary>Rodyti atsakymo pavyzdį</summary><div><p>1920 m. lapkritį lietuviai <b>sumušė</b> Želigovskio dalinius prie Širvintų ir Giedraičių, tačiau tolesnį puolimą sustabdė <b>Tautų Sąjunga</b>, todėl Vilnius su aplinkinėmis teritorijomis liko Lenkijos rankose.</p></div></details></div>
<div class="hist-q"><p class="hq"><span class="hq-num">19.</span> Kas ir kada pripažino Lietuvos–Lenkijos sieną, kuria Vilnius atiteko Lenkijai?</p>
<details class="reveal"><summary>Rodyti atsakymo pavyzdį</summary><div><p><b>1923 m. kovo 15 d. Ambasadorių konferencija</b> – taip buvo teisiškai įtvirtinta Vilniaus krašto aneksija Lenkijai.</p></div></details></div>

<h3>F. Rezultatai ir žemėlapis</h3>
<div class="hist-q"><p class="hq"><span class="hq-num">20.</span> Įvardyk du Nepriklausomybės karo laimėjimus ir du praradimus.</p>
<details class="reveal"><summary>Rodyti atsakymo pavyzdį</summary><div><p><b>Laimėjimai:</b> apginta nepriklausomybė nuo kelių priešų; tarptautinis pripažinimas (Maskvos sutartis, vėliau – de jure pripažinimas). <b>Praradimai:</b> sostinė Vilnius su aplinkinėmis teritorijomis; apie <b>4000</b> žuvusiųjų.</p></div></details></div>
<div class="hist-q"><p class="hq"><span class="hq-num">21.</span> Žemėlapyje: ką reiškia brūkšniuota linija šiaurės vakarų Lietuvoje, geltona sritis prie Vilniaus ir raudonos rodyklės rytuose?</p>
<details class="reveal"><summary>Rodyti atsakymo pavyzdį</summary><div><p><b>Brūkšniuota linija</b> – bermontininkų užimtų teritorijų rytinė riba; <b>geltona sritis</b> – L. Želigovskio užimta Lietuvos teritorija; <b>raudonos rodyklės</b> – raudonosios armijos puolimas 1920 m. vasarą.</p></div></details></div>

const state={visits:null,current:null,testRuns:{},mapPin:null,returnToTest:null};

function findSubject(id){return DATA.subjects.find(function(s){return s.id===id;})||null;}
function findTopic(subject,id){return subject&&subject.topics?subject.topics.find(function(t){return t.id===id;})||null:null;}

/* ---------- MARŠRUTIZAVIMAS ---------- */
function getRoute(){
  const raw=location.hash.replace(/^#\/?/,'');
  return raw.split('/').filter(Boolean).map(decodeURIComponent);
}
function applyRoute(){
  toggleNav(false);
  const parts=getRoute();
  const app=document.getElementById('app');
  let html='';
  if(parts.length===0){
    html=viewHome();
    document.title=DATA.siteName;
  }else{
    const subject=findSubject(parts[0]);
    if(!subject){html=viewNotFound();document.title=DATA.siteName;}
    else if(parts.length===1){
      html=viewSubject(subject);
      document.title=subject.name+' · '+DATA.siteName;
    }else{
      const topic=findTopic(subject,parts[1]);
      if(!topic){html=viewNotFound();document.title=DATA.siteName;}
      else if(parts.length===2){
        html=viewTopic(subject,topic,null);
        document.title=topic.name+' · '+subject.name+' · '+DATA.siteName;
      }else if(parts[2]==='s'&&parts[3]){
        html=viewTopic(subject,topic,parts[3]);
        document.title=topic.name+' · '+subject.name+' · '+DATA.siteName;
      }else if(parts[2]==='testas'){
        html=viewTest(subject,topic);
        document.title='Testas · '+topic.name+' · '+DATA.siteName;
      }else if(parts[2]==='kontrolinis'){
        html=viewControl(subject,topic);
        document.title='Kontrolinio nuotraukos · '+topic.name+' · '+DATA.siteName;
      }else{
        html=viewNotFound();document.title=DATA.siteName;
      }
    }
  }
  app.innerHTML=html;
  typesetMath(app);
  restoreTestView();
  restoreMapState();
  renderCounter();
  window.scrollTo(0,0);
  if(state.pendingFlash){
    const flashId=state.pendingFlash;
    state.pendingFlash=null;
    setTimeout(function(){
      const el=document.querySelector('.section-content');
      if(el){
        el.scrollIntoView({behavior:'smooth',block:'start'});
        el.classList.add('flash-box');
        setTimeout(function(){el.classList.remove('flash-box');},3300);
      }
    },140);
  }
}

/* ---------- PUSLAPIŲ ŠABLONAI ---------- */
function viewNotFound(){
  return '<main class="wrap"><div class="page-head" style="padding-top:70px">'+
    '<h1>Puslapis nerastas</h1><p>Galbūt nuoroda pasenusi arba įvesta su klaida.</p>'+
    '<p><a class="btn primary" href="#/">← Grįžti į pradžią</a></p></div></main>';
}

function viewHome(){
  const subjects=DATA.subjects.filter(function(s){return (s.topics||[]).length>0;});
  let grid='';
  if(subjects.length){
    grid='<div class="subject-grid">'+subjects.map(function(s){return subjectCard(s);}).join('')+'</div>';
  }else{
    grid='<div class="callout warn"><span class="ico">📭</span><div>Kol kas nėra nė vieno dalyko su temomis.</div></div>';
  }
  return '<header class="home-hero"><div class="wrap">'+
    '<span class="brand">📚 '+escapeHtml(DATA.siteName)+'</span>'+
    '<h1>Pasirink pamoką</h1>'+
    '<p class="hero-sub">Mokykis savo tempu: teorija, pavyzdžiai ir testas vienoje vietoje.</p>'+
    '</div></header>'+
    '<main class="wrap home-main">'+continueHtml()+grid+'</main>'+
    '<footer class="home-footer wrap"><span class="visit-counter" id="visitCounter" title="Bendras svetainės apsilankymų skaičius (didėja ne dažniau kaip kartą per minutę)" hidden></span></footer>';
}
/* „Tęsk, kur baigei“ – paskutinė atidaryta sekcija (saugoma tik šioje naršyklėje) */
const LAST_PLACE_KEY='eduvia-last-place';
function rememberLastPlace(href,label){
  storageSet(LAST_PLACE_KEY,JSON.stringify({href:href,label:label}));
}
function continueHtml(){
  let last=null;
  try{last=JSON.parse(storageGet(LAST_PLACE_KEY)||'null');}catch(err){last=null;}
  if(!last||typeof last.href!=='string'||last.href.indexOf('#/')!==0)return '';
  return '<a class="continue-card" href="'+escapeHtml(last.href)+'">'+
    '<span class="cc-ico">▶</span><span class="cc-body"><span class="cc-label">Tęsk, kur baigei</span>'+
    '<span class="cc-title">'+escapeHtml(last.label||'')+'</span></span><span class="cc-arrow">→</span></a>';
}
function subjectCard(s){
  const n=s.topics.length;
  const chips=s.topics.slice(0,4).map(function(t){return '<span class="chip">'+escapeHtml(topicMenuName(t))+'</span>';}).join('')+
    (n>4?'<span class="chip">+'+(n-4)+'</span>':'');
  return '<a class="subject-card" href="#/'+s.id+'">'+
    '<div class="subject-icon">'+(s.icon||'📘')+'</div>'+
    '<div class="subject-body"><h2>'+escapeHtml(s.name)+' <span class="count">('+n+' '+ltPlural(n,'tema','temos','temų')+')</span></h2>'+
    '<p>'+(s.description||'')+'</p>'+
    '<div class="topic-chips">'+chips+'</div></div>'+
    '<div class="subject-arrow">→</div></a>';
}

function viewSubject(subject){
  const topics=subject.topics||[];
  const cards=topics.map(function(t,i){
    const n=(t.sections||[]).length;
    const meta=n+' '+ltPlural(n,'sekcija','sekcijos','sekcijų')+
      ((t.test&&t.test.bank&&t.test.bank.length)?' · yra testas':'')+
      (hasControl(t)?' · yra kontrolinio nuotraukos':'');
    return '<a class="topic-card" href="#/'+subject.id+'/'+t.id+'">'+
      '<span class="tc-num">'+(i+1)+'</span>'+
      '<div style="flex:1;min-width:0"><h2>'+escapeHtml(topicMenuName(t))+'</h2>'+
      '<p>'+(t.subtitle||'')+'</p>'+
      '<span class="tc-meta">'+meta+'</span></div>'+
      '<span class="tc-arrow">→</span></a>';
  }).join('');
  return '<main class="wrap">'+
    '<nav class="crumbs"><a href="#/">Visi dalykai</a><span class="sep">/</span><span>'+escapeHtml(subject.name)+'</span></nav>'+
    '<header class="page-head"><span class="pick-label">Pasirink temą</span>'+
    '<h1>'+(subject.icon||'')+' '+escapeHtml(subject.name)+'</h1>'+
    '<p>'+(subject.description||'')+'</p></header>'+
    '<div class="topic-list" style="padding-bottom:60px">'+cards+'</div>'+
    '</main>';
}

function hasTest(topic){
  return !!(topic&&topic.test&&topic.test.bank&&topic.test.bank.length>0);
}
function hasControl(topic){
  return !!(topic&&topic.control&&topic.control.items&&topic.control.items.length>0);
}

function topicMenuName(t){return t.menuName||t.name;}
function sideNavHtml(subject,topic,active){
  const sections=topic.sections||[];
  const base='#/'+subject.id+'/'+topic.id;
  const items=sections.map(function(s,i){
    const out=s.outcome?'<span class="nav-out '+(s.outcomeClass||'win')+'">· '+escapeHtml(s.outcome)+'</span>':'';
    return '<li><a class="nav-link'+(active===s.id?' active':'')+'" href="'+base+'/s/'+s.id+'">'+
      '<span class="nav-num">'+(i+1)+'</span><span>'+escapeHtml(s.title)+out+'</span></a></li>';
  }).join('');
  let extra='';
  if(hasTest(topic)||hasControl(topic)){
    extra='<div class="nav-sep"></div>';
    if(hasTest(topic))extra+='<a class="nav-link nav-test'+(active==='testas'?' active':'')+'" href="'+base+'/testas"><span class="nav-num">✓</span><span>Testas</span></a>';
    if(hasControl(topic))extra+='<a class="nav-link nav-control'+(active==='kontrolinis'?' active':'')+'" href="'+base+'/kontrolinis"><span class="nav-num">📷</span><span>Kontrolinio nuotraukos</span></a>';
  }
  return '<aside class="side-nav" id="sideNav" aria-label="Temos navigacija">'+
    '<div class="side-head">'+escapeHtml(subject.name)+' · '+escapeHtml(topicMenuName(topic))+'</div>'+
    '<ol class="nav-list">'+items+'</ol>'+
    extra+
    '<div class="nav-sep"></div>'+
    '<a class="nav-link" href="#/'+subject.id+'"><span class="nav-num">←</span><span>'+escapeHtml(subject.name)+' temos</span></a>'+
    '<a class="nav-link" href="#/"><span class="nav-num">←</span><span>Visi dalykai</span></a>'+
    '<button class="nav-close" type="button" data-action="close-nav">✕ Uždaryti meniu</button>'+
    '</aside>';
}
function mobileBar(text,prevHref,nextHref){
  const arrows=(prevHref!==undefined||nextHref!==undefined)?
    '<span class="mtb-arrows">'+
      (prevHref?'<a class="mtb-arrow" href="'+prevHref+'" aria-label="Ankstesnė sekcija">‹</a>':'<span class="mtb-arrow off" aria-hidden="true">‹</span>')+
      (nextHref?'<a class="mtb-arrow" href="'+nextHref+'" aria-label="Kita sekcija">›</a>':'<span class="mtb-arrow off" aria-hidden="true">›</span>')+
    '</span>':'';
  return '<div class="mobile-topicbar">'+
    '<button class="mtb-btn" type="button" data-action="open-nav" aria-label="Atidaryti sekcijų sąrašą">☰ Sekcijos</button>'+
    '<span class="mtb-title">'+escapeHtml(text)+'</span>'+arrows+'</div>'+
    '<div class="nav-backdrop" id="navBackdrop" data-action="close-nav"></div>';
}

function backToTestHtml(subject,topic){
  const r=state.returnToTest;
  if(!r||r.subjectId!==subject.id||r.topicId!==topic.id)return '';
  if(!hasTest(topic))return '';
  return '<div style="flex:1 1 100%"><a class="review-link" href="#/'+subject.id+'/'+topic.id+'/testas">🎯 Grįžti į testą (tavo atsakymai išsaugoti)</a></div>';
}
function viewTopic(subject,topic,sectionId){
  const sections=topic.sections||[];
  let idx=0;
  if(sectionId){
    const found=sections.findIndex(function(s){return s.id===sectionId;});
    if(found>=0)idx=found;
  }
  const sec=sections[idx]||{title:'',html:''};
  const prev=idx>0?sections[idx-1]:null;
  const next=idx<sections.length-1?sections[idx+1]:null;
  const base='#/'+subject.id+'/'+topic.id;
  rememberLastPlace(base+'/s/'+sec.id,topicMenuName(topic)+' · '+sec.title);
  const nextHref=next?base+'/s/'+next.id:(hasTest(topic)?base+'/testas':null);
  return mobileBar(topicMenuName(topic)+' · '+(idx+1)+'/'+sections.length,prev?base+'/s/'+prev.id:null,nextHref)+
    '<div class="topic-layout">'+
    sideNavHtml(subject,topic,sec.id)+
    '<main class="topic-main">'+
    '<nav class="crumbs"><a href="#/">Visi dalykai</a><span class="sep">/</span>'+
    '<a href="#/'+subject.id+'">'+escapeHtml(subject.name)+'</a><span class="sep">/</span>'+
    '<span>'+escapeHtml(topicMenuName(topic))+'</span></nav>'+
    '<header class="topic-head"><h1>'+escapeHtml(sec.title)+'</h1>'+
    '<span class="topic-progress">Sekcija '+(idx+1)+' iš '+sections.length+'</span></header>'+
    '<article class="section-content">'+(sec.html||'')+'</article>'+
    '<div class="pager">'+
      backToTestHtml(subject,topic)+
      (prev?'<a class="btn ghost" href="'+base+'/s/'+prev.id+'">← '+escapeHtml(prev.title)+'</a>':'<span></span>')+
      (next?'<a class="btn ghost" href="'+base+'/s/'+next.id+'">'+escapeHtml(next.title)+' →</a>':
        (hasTest(topic)?'<a class="btn primary" href="'+base+'/testas">🎯 Eiti į testą →</a>':''))+
    '</div>'+
    '</main></div>';
}

/* ---------- TESTAS ---------- */
function prepareQuestion(q){
  const c=Object.assign({},q);
  if(q.type==='single'||q.type==='multi'||q.type==='formula'){
    const idx=q.options.map(function(_,i){return i;});
    shuffle(idx);
    c._options=idx.map(function(i){return q.options[i];});
    if(typeof q.correct==='number')c._correct=idx.indexOf(q.correct);
    else c._correct=q.correct.map(function(k){return idx.indexOf(k);}).sort(function(a,b){return a-b;});
  }
  return c;
}
function startTest(subject,topic){
  const cfg=topic.test||{};
  const bank=(cfg.bank||[]).slice();
  const total=Math.min(cfg.total||12,bank.length);
  const mix=cfg.mix||{};
  const chosen=[];
  Object.keys(mix).forEach(function(type){
    const pool=shuffle(bank.filter(function(q){return q.type===type;}));
    const need=mix[type];
    for(let i=0;i<need&&i<pool.length;i++)chosen.push(pool[i]);
  });
  const rest=shuffle(bank.filter(function(q){return chosen.indexOf(q)===-1;}));
  while(chosen.length<total&&rest.length)chosen.push(rest.shift());
  if(chosen.length>total)chosen.length=total;
  shuffle(chosen);
  return {subjectId:subject.id,topicId:topic.id,total:total,checked:false,questions:chosen.map(prepareQuestion)};
}
function figureFor(key){
  if(!key)return '';
  if(key==='DIAL')return FIGS.dial;
  if(key==='DIAL_KPA')return FIGS.dialKpa;
  if(key==='GRAPH')return FIGS.graph;
  return FIGS[key]||'';
}
function sectionById(subject,topic,id){
  const secs=(topic&&topic.sections)||[];
  for(let i=0;i<secs.length;i++)if(secs[i].id===id)return secs[i];
  return null;
}
function guessTopic(q){
  if(q.topic)return q.topic;
  const t=(q.text||'')+' '+(q.explanation||'')+' '+(q.options?q.options.join(' '):'')+
    ' '+((q.statements||[]).map(function(s){return s.text;}).join(' '))+
    ' '+((q.parts||[]).map(function(p){return p.label;}).join(' '));
  const has=function(re){return re.test(t);};
  if(/Kas yra slėgis|Ką nusako slėgis/i.test(t))return 'kas-yra-slegis';
  if(has(/hidraul/i))return 'hidraulinis-presas';
  if(has(/Archimedo|plūdur|plaukd|nuskęs|nuskęsta|išstumto|panardint|skęsta|iškyla|laiv/i))return 'archimedas';
  if(has(/atmosferos slėg|kaln|deguonies|ausis|ausyse/i))return 'atmosferos-slegis';
  if(has(/manometr|barometr|ciferblat|prietais/i))return 'prietaisai';
  if(has(/stulpelio|gyl|dugn|hidrostatin|mėgintuv|verdan/i))return 'skyscio-stulpelis';
  if(has(/Paskalio/i))return 'skysciai-ir-dujos';
  if(has(/plotą|plotas|plotui|nepriklauso|proporcing|padidinti slėgį|mažin|grindis|koja/i))return 'kaip-padidinti-sumazinti';
  return 'formule-ir-vienetai';
}
function renderQuestion(q,i){
  const labels={single:'Pasirinkimas',multi:'Keli teisingi atsakymai',truefalse:'TAIP / NE',formula:'Formulė',numeric:'Skaičiavimas',parts:'Kelių žingsnių uždavinys'};
  let body='';
  if(q.type==='single'||q.type==='multi'||q.type==='formula'){
    const opts=q._options||q.options||[];
    const inputType=q.type==='multi'?'checkbox':'radio';
    body=(q.type==='multi'?'<p class="muted" style="margin:0 0 8px">Pažymėkite '+(q.pick||2)+' teisingus atsakymus.</p>':'')+
      '<div class="options">'+opts.map(function(o,j){
        return '<label class="option" data-opt="'+j+'"><input type="'+inputType+'" name="q'+i+'" value="'+j+'">'+
          '<span><b>'+(String.fromCharCode(65+j))+')</b> '+o+'</span></label>';
      }).join('')+'</div>';
  }else if(q.type==='truefalse'){
    body='<div class="tf-list">'+q.statements.map(function(s,j){
      return '<div class="tf-row" data-stmt="'+j+'">'+
        '<div class="tf-text">'+(j+1)+'. '+s.text+'</div>'+
        '<div class="seg">'+
        '<label><input type="radio" name="q'+i+'s'+j+'" value="taip"> TAIP</label>'+
        '<label><input type="radio" name="q'+i+'s'+j+'" value="ne"> NE</label>'+
        '</div></div>';
    }).join('')+'</div>';
  }else if(q.type==='numeric'){
    body='<div class="num-answer"><input class="num-input" type="text" inputmode="decimal" autocomplete="off" placeholder="Įrašyk skaičių" aria-label="Atsakymas">'+
      (q.unit?'<span class="num-unit">'+q.unit+'</span>':'')+'</div>';
  }else if(q.type==='parts'){
    body='<div class="parts-list">'+q.parts.map(function(p,j){
      return '<div class="part-row" data-part="'+j+'">'+
        '<div class="part-label">'+p.label+'</div>'+
        '<div class="num-answer"><input class="num-input" type="text" inputmode="decimal" autocomplete="off" placeholder="Atsakymas" aria-label="Atsakymas">'+
        (p.unit?'<span class="num-unit">'+p.unit+'</span>':'')+'</div></div>';
    }).join('')+'</div>';
  }
  const figure=q.figure?'<div class="q-figure">'+figureFor(q.figure)+'</div>':'';
  return '<section class="q-card" id="q'+i+'" data-qi="'+i+'">'+
    '<div class="q-meta"><span class="q-num">'+(i+1)+'</span><span class="q-type">'+(labels[q.type]||'')+'</span><span class="q-badge"></span></div>'+
    '<div class="q-text">'+q.text+'</div>'+
    figure+body+
    '<div class="feedback" hidden></div></section>';
}

  const card=img.closest('.control-card');
  const tries=parseInt(img.getAttribute('data-tries')||'0',10);
  const next=tries===0?img.getAttribute('data-alt1'):(tries===1?img.getAttribute('data-alt2'):null);
  if(next){
    img.setAttribute('data-tries',String(tries+1));
    img.src=next;
    if(card){
      const dl=card.querySelector('.control-dl');
      if(dl)dl.setAttribute('href',next);
    }
    return;
  }
  if(card)card.classList.add('img-missing');
  img.remove();
}

function arraysEqual(a,b){
  if(a.length!==b.length)return false;
  for(let i=0;i<a.length;i++)if(a[i]!==b[i])return false;
  return true;
}
function withinTolerance(val,answer,tol){
  if(!isFinite(val))return false;
  const t=Math.max((tol||0.02)*Math.abs(answer),1e-9);
  return Math.abs(val-answer)<=t;
}
function feedbackBlock(ok,answerHtml,steps,explanation,extra){
  return '<span class="fb-title">'+(ok?'✓ Teisingai!':'✗ Neteisingai')+'</span>'+
    (ok?'':'<div class="ans">Teisingas atsakymas: '+answerHtml+'</div>')+
    (extra?'<div class="muted">'+extra+'</div>':'')+
    (steps&&steps.length?'<ol class="steps">'+steps.map(function(s){return '<li>'+s+'</li>';}).join('')+'</ol>':'')+
    (explanation?'<div>Paaiškinimas: '+explanation+'</div>':'');
}
function evaluateQuestion(q,i,card,form){
  if(q.type==='single'||q.type==='multi'||q.type==='formula'){
    const inputs=Array.prototype.slice.call(card.querySelectorAll('input[name="q'+i+'"]'));
    const checked=inputs.filter(function(x){return x.checked;}).map(function(x){return Number(x.value);});
    const correctArr=q.type==='multi'?q._correct.slice():[q._correct];
    let ok;
    if(q.type==='multi')ok=arraysEqual(checked.slice().sort(function(a,b){return a-b;}),correctArr.slice().sort(function(a,b){return a-b;}));
    else ok=checked.length===1&&checked[0]===correctArr[0];
    inputs.forEach(function(x){
      const j=Number(x.value),lab=x.closest('.option');
      if(correctArr.indexOf(j)!==-1)lab.classList.add('correct');
      if(x.checked&&correctArr.indexOf(j)===-1)lab.classList.add('incorrect');
    });
    const opts=q._options||q.options;
    const correctHtml=correctArr.map(function(j){return '<b>'+String.fromCharCode(65+j)+')</b> '+opts[j];}).join('; ');
    const extra=(!ok&&checked.length)?'Tavo pasirinkimas: '+checked.map(function(j){return String.fromCharCode(65+j);}).join(', '):'';
    return {ok:ok,feedback:feedbackBlock(ok,correctHtml,null,q.explanation,extra)};
  }
  if(q.type==='truefalse'){
    let ok=true,rowsHtml='';
    q.statements.forEach(function(s,j){
      const row=card.querySelector('[data-stmt="'+j+'"]');
      const checked=row.querySelector('input:checked');
      const correctAns=s.answer?'taip':'ne';
      const rowOk=checked&&checked.value===correctAns;
      if(!rowOk)ok=false;
      row.classList.add(rowOk?'correct':'incorrect');
      rowsHtml+='<div>'+(rowOk?'✓':'✗')+' '+(j+1)+'. Teisingas atsakymas: <b>'+correctAns.toUpperCase()+'</b>.'+(s.note?' '+s.note:'')+'</div>';
    });
    return {ok:ok,feedback:'<span class="fb-title">'+(ok?'✓ Visi atsakymai teisingi!':'✗ Yra klaidų')+'</span>'+rowsHtml+
      (q.explanation?'<div style="margin-top:6px">Paaiškinimas: '+q.explanation+'</div>':'')};
  }
  if(q.type==='numeric'){
    const input=card.querySelector('.num-input');
    const val=toNumberLt(input?input.value:'');
    const ok=withinTolerance(val,q.answer,q.tolerance);
    if(input)input.style.borderColor=ok?'var(--ok)':'var(--bad)';
    return {ok:ok,feedback:feedbackBlock(ok,numLt(q.answer)+(q.unit?' '+q.unit:''),q.steps,q.explanation,'')};
  }
  if(q.type==='parts'){
    let allOk=true;
    const rows=q.parts.map(function(p,j){
      const row=card.querySelector('[data-part="'+j+'"]');
      const input=row.querySelector('.num-input');
      const val=toNumberLt(input?input.value:'');
      const ok=withinTolerance(val,p.answer,p.tolerance);
      if(!ok)allOk=false;
      if(input)input.style.borderColor=ok?'var(--ok)':'var(--bad)';
      return '<div>'+(ok?'✓':'✗')+' '+(j+1)+'. '+p.label+' → teisingas atsakymas: <b class="ans">'+numLt(p.answer)+(p.unit?' '+p.unit:'')+'</b>'+
        (p.steps&&p.steps.length?'<ol class="steps">'+p.steps.map(function(s){return '<li>'+s+'</li>';}).join('')+'</ol>':'')+'</div>';
    }).join('');
    return {ok:allOk,feedback:'<span class="fb-title">'+(allOk?'✓ Teisingai!':'✗ Yra klaidų')+'</span>'+rows+
      (q.explanation?'<div>Paaiškinimas: '+q.explanation+'</div>':'')};
  }
  return {ok:false,feedback:'Klaida: nežinomas klausimo tipas.'};
}

function testStorageKey(subjectId,topicId){return 'eduvia-testrun:'+subjectId+'/'+topicId;}
function saveTestRun(run){
  try{sessionStorage.setItem(testStorageKey(run.subjectId,run.topicId),JSON.stringify(run));}catch(err){}
}
function loadTestRun(subjectId,topicId){
  try{
    const raw=sessionStorage.getItem(testStorageKey(subjectId,topicId));
    if(!raw)return null;
    const run=JSON.parse(raw);
    if(!run||!Array.isArray(run.questions)||!run.questions.length)return null;
    return run;
  }catch(err){return null;}
}
function collectAnswers(run){
  const form=document.getElementById('testForm');
  if(!form||!run)return;
  run.answers=run.questions.map(function(q,i){
    if(q.type==='single'||q.type==='multi'||q.type==='formula'){
      return Array.prototype.slice.call(form.querySelectorAll('input[name="q'+i+'"]')).filter(function(x){return x.checked;}).map(function(x){return Number(x.value);});
    }
    if(q.type==='truefalse'){
      return q.statements.map(function(s,j){
        const el=form.querySelector('[data-stmt="'+j+'"] input[name="q'+i+'s'+j+'"]:checked');
        return el?el.value:null;
      });
    }
    if(q.type==='numeric'){
      const el=form.querySelector('#q'+i+' .num-input');
      return el?el.value:'';
    }
    if(q.type==='parts'){
      return q.parts.map(function(p,j){
        const el=form.querySelector('#q'+i+' [data-part="'+j+'"] .num-input');
        return el?el.value:'';
      });
    }
    return null;
  });
  saveTestRun(run);
}
function restoreAnswers(run){
  const form=document.getElementById('testForm');
  if(!form||!run||!run.answers)return;
  run.questions.forEach(function(q,i){
    const a=run.answers[i];
    if(a===null||a===undefined)return;
    if(q.type==='single'||q.type==='multi'||q.type==='formula'){
      Array.prototype.slice.call(form.querySelectorAll('input[name="q'+i+'"]')).forEach(function(x){
        if(a.indexOf(Number(x.value))!==-1)x.checked=true;
      });
    }else if(q.type==='truefalse'){
      a.forEach(function(v,j){
        if(!v)return;
        const el=form.querySelector('[data-stmt="'+j+'"] input[name="q'+i+'s'+j+'"][value="'+v+'"]');
        if(el)el.checked=true;
      });
    }else if(q.type==='numeric'){
      const el=form.querySelector('#q'+i+' .num-input');
      if(el)el.value=a;
    }else if(q.type==='parts'){
      a.forEach(function(v,j){
        if(v===null||v===undefined)return;
        const el=form.querySelector('#q'+i+' [data-part="'+j+'"] .num-input');
        if(el)el.value=v;
      });
    }
  });
}
function displayTestResults(run,form){
  const result=document.getElementById('resultPanel');
  if(!form||!result)return;
  let correctCount=0;
  const wrongList=[];
  run.questions.forEach(function(q,i){
    const card=document.getElementById('q'+i);
    if(!card)return;
    const res=evaluateQuestion(q,i,card,form);
    if(res.ok)correctCount++;else wrongList.push(i);
    card.classList.add(res.ok?'is-correct':'is-wrong');
    const badge=card.querySelector('.q-badge');
    if(badge)badge.textContent=res.ok?'✓':'✗';
    const fb=card.querySelector('.feedback');
    fb.hidden=false;
    fb.classList.add(res.ok?'ok':'bad');
    fb.innerHTML=res.feedback;
    if(!fb.querySelector('.review-link'))fb.insertAdjacentHTML('beforeend',reviewButtonHtml(q));
    typesetMath(fb);
  });
  run.checked=true;
  form.querySelectorAll('input').forEach(function(inp){inp.disabled=true;});
  const n=run.questions.length;
  const pct=n?Math.round(correctCount/n*100):0;
  let cls='bad',msg='📖 Grįžk į teoriją, perskaityk paaiškinimus ir bandyk dar kartą.';
  if(pct>=90){cls='good';msg='🏆 Puikiai! Šią temą moki.';}
  else if(pct>=70){cls='good';msg='🎉 Labai gerai! Dar peržvelk, kur suklydai.';}
  else if(pct>=50){cls='mid';msg='👍 Jau neblogai – pasikartok silpnesnes vietas.';}
  result.className='result-panel '+cls;
  result.hidden=false;
  result.innerHTML='<div class="result-score">'+correctCount+'/'+n+' <small>('+pct+'%)</small></div>'+
    '<div class="result-msg">'+msg+'</div>'+
    (wrongList.length
      ? '<div class="result-list">Klaidos: '+wrongList.map(function(i){return '<button type="button" class="qlink" data-action="goto-q" data-q="'+i+'">'+(i+1)+'</button>';}).join(', ')+' – spausk numerį, nuves į klausimą.</div>'
      : '<div class="result-list">Nė vienos klaidos – šaunu!</div>');
  typesetMath(result);
  const checkBtn=document.getElementById('checkBtn');
  if(checkBtn)checkBtn.hidden=true;
  const retryBtn=document.getElementById('retryBtn');
  if(retryBtn)retryBtn.hidden=false;
  saveTestRun(run);
}
function restoreTestView(){
  const form=document.getElementById('testForm');
  if(!form)return;
  const run=state.current&&state.current.testRun;
  if(!run)return;
  restoreAnswers(run);
  if(run.checked)displayTestResults(run,form);
}
function checkTest(){
  const run=state.current&&state.current.testRun;
  const form=document.getElementById('testForm');
  if(!run||run.checked||!form)return;
  collectAnswers(run);
  displayTestResults(run,form);
  const result=document.getElementById('resultPanel');
  if(result)result.scrollIntoView({block:'start'});
}

function toggleNav(open){
